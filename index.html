<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111a21">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bandas">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bandas en casa</title>
<style>
/* ============ Tokens ============ */
:root{
  --bg:#111a21; --s1:#18232c; --s2:#1f2d39; --s3:#2a3b4a; --line:#2b3c4a;
  --tx:#edf1ea; --mut:#8ea0ad;
  --acc:#f5cf47; --acc-i:#211a00;
  --work:#f5cf47; --rest:#5aa9f0; --ok:#62c98f; --bad:#ef6b5b;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
:root[data-tema="claro"]{
  --bg:#f3f1e9; --s1:#ffffff; --s2:#ebe8dd; --s3:#dcd8ca; --line:#d6d2c4;
  --tx:#17222b; --mut:#5f6c75;
  --acc:#f2c320; --acc-i:#211a00;
  --work:#c99700; --rest:#2a7fd0; --ok:#1f9d63; --bad:#d64533;
}
@media (prefers-color-scheme:light){
  :root[data-tema="auto"]{
    --bg:#f3f1e9; --s1:#ffffff; --s2:#ebe8dd; --s3:#dcd8ca; --line:#d6d2c4;
    --tx:#17222b; --mut:#5f6c75;
    --acc:#f2c320; --acc-i:#211a00;
    --work:#c99700; --rest:#2a7fd0; --ok:#1f9d63; --bad:#d64533;
  }
}

/* ============ Base ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
html[data-tema="claro"]{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:var(--tx);background:var(--s2);border:1.5px solid var(--line);border-radius:14px;min-height:48px;padding:0 12px;width:100%}
input[type=search]{-webkit-appearance:none;appearance:none}
input[type=checkbox]{width:auto;min-height:0;padding:0;border:0;background:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
h3{font-size:17px;font-weight:700}
small,.hint{color:var(--mut);font-size:14px}
.hint{margin:4px 0 10px}

#app{max-width:560px;margin:0 auto;min-height:100dvh;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
#topbar{padding:calc(16px + env(safe-area-inset-top)) 0 6px}
.fecha{color:var(--mut);font-size:15px;margin-top:2px}

/* ============ Navegación ============ */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:12.5px;font-weight:600;color:var(--mut);min-height:64px}
#tabs button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--acc)}
:root[data-tema="claro"] #tabs button.on{color:var(--tx)}
#tabs button.on span{border-bottom:3px solid var(--acc);padding-bottom:1px}

/* ============ Componentes ============ */
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0}
.card>h3{margin-bottom:2px}
.btn{min-height:52px;padding:0 20px;border-radius:16px;background:var(--s3);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--acc);color:var(--acc-i)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:44px;padding:0 14px;border-radius:12px;font-size:14.5px}
.btn.block{width:100%}
.btn.big{min-height:78px;font-size:24px;border-radius:24px;width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.row>.grow{flex:1}
.stack>*+*{margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:0 14px;min-height:44px;border-radius:999px;background:var(--s2);border:1.5px solid var(--line);font-size:14.5px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-i)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--s3);color:var(--mut);font-size:12.5px;font-weight:600}
.warn{background:rgba(239,107,91,.14);border:1px solid rgba(239,107,91,.45);background:color-mix(in srgb,var(--bad) 14%,transparent);border-color:color-mix(in srgb,var(--bad) 45%,transparent);border-radius:14px;padding:10px 12px;font-size:14px;margin-top:10px}
.note{background:var(--s2);border-radius:14px;padding:10px 12px;font-size:14px;color:var(--mut);margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:28px 8px}

/* Semana */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 4px}
.dia{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 8px;border-radius:14px;background:var(--s1);border:1.5px solid var(--line);min-height:70px}
.dia.hoy{border-color:var(--acc);background:var(--s2)}
.dia .dl{font-size:12.5px;color:var(--mut);font-weight:700}
.dia .dn{font-size:18px;font-weight:800}
.dia .pts{display:flex;gap:3px;height:8px;margin-top:3px;align-items:center}
.pt{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.pt.ok{background:var(--ok)}
.pt.lib{background:var(--rest)}
.pt.off{background:var(--s3)}

/* Rutinas y ejercicios */
.rut h3{font-size:19px}
.rut .desc{color:var(--mut);font-size:15px;margin:2px 0 8px}
.rut .meta{font-size:14px;color:var(--mut)}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.dias .chip{padding:0;justify-content:center;min-height:44px}
.acciones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.acciones .primary{grid-column:1/-1}
.filtros{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.ex{display:block;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin:8px 0}
.ex.pick{display:flex;align-items:center;gap:10px}
.ex .n{font-weight:700;font-size:16.5px}
.ex .m{color:var(--mut);font-size:14px;margin-top:1px}
.ex .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.grp{font-weight:700;color:var(--mut);font-size:14px;margin:18px 0 2px}

/* Formularios */
.field{margin:10px 0}
.field>label{display:block;font-weight:700;margin-bottom:6px;font-size:15px}
.banda{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:8px;align-items:center;margin:10px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.banda:last-of-type{border-bottom:0}
.banda input.nota{grid-column:2 / 4}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut)}
.x{width:44px;height:44px;border-radius:12px;font-size:24px;line-height:1;color:var(--mut);display:inline-flex;align-items:center;justify-content:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-weight:600}
.sw input{width:26px;height:26px;accent-color:var(--acc)}
.foot{color:var(--mut);font-size:13.5px;text-align:center;margin:18px 8px}

/* Steppers (editor) */
.eit{background:var(--s2);border-radius:18px;padding:12px;margin:10px 0}
.eit-n{font-weight:700}
.eit-c{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:10px}
.stpw small{display:block;font-size:12.5px;margin-bottom:3px}
.stp{display:inline-flex;align-items:center;background:var(--s1);border-radius:12px;border:1px solid var(--line)}
.stp button{width:44px;height:44px;font-size:22px;font-weight:700}
.stp span{min-width:40px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.eit-o{margin-left:auto;display:flex}
.eit-o button{width:44px;height:44px;color:var(--mut);font-size:16px}

/* ============ Hojas (sheets) ============ */
.backdrop{position:fixed;inset:0;background:rgba(4,8,12,.6);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90dvh;z-index:51;background:var(--s1);border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;border:1px solid var(--line);border-bottom:0}
.sheet.full{top:0;max-height:none;border-radius:0;border:0}
.sheet>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 10px 8px 18px;min-height:64px}
.sheet.full>header{padding-top:calc(10px + env(safe-area-inset-top))}
.sheet-body{overflow:auto;padding:0 18px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-foot .btn{flex:1;padding:0 10px}
.modal{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:420px;margin:0 auto;z-index:51;background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:20px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.ficha h4{margin:16px 0 4px;font-size:15px;font-weight:800}
.ficha p,.ficha li{font-size:16px}
.ficha ol,.ficha ul{margin:4px 0;padding-left:22px}
.ficha li+li{margin-top:4px}
.ficha .hd{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 4px}
.ficha .pain{margin-top:18px}

/* ============ Entrenamiento ============ */
#train{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
#train[hidden]{display:none}
.tr{display:flex;flex-direction:column;height:100%;max-width:560px;width:100%;margin:0 auto}
.tr-top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 6px}
.tr-top .ttl{flex:1;min-width:0}
.tr-top .ttl b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-top .ttl span{font-size:13.5px;color:var(--mut)}
.tr-bar{display:flex;gap:4px;padding:6px 16px}
.tr-bar i{flex:1;height:6px;border-radius:3px;background:var(--s3)}
.tr-bar i.done{background:var(--ok)}
.tr-bar i.cur{background:var(--work)}
.tr.rest .tr-bar i.cur{background:var(--rest)}
.tr-main{flex:1;overflow:auto;padding:6px 20px 12px;text-align:center;display:flex;flex-direction:column;align-items:center}
.tr-set{color:var(--mut);font-weight:700;margin-top:8px}
.tr-name{font-size:clamp(26px,8vw,36px);line-height:1.1;margin:4px 0 4px;letter-spacing:-.02em}
.tr-sub{color:var(--mut);font-size:15px}
.ring{position:relative;width:min(70vw,44dvh,300px);aspect-ratio:1;margin:10px auto}
.ring svg{width:100%;height:100%;display:block}
.ring .track{stroke:var(--s3)}
.ring .prog{stroke:var(--work);transition:stroke-dashoffset .25s linear}
.ring.rest .prog{stroke:var(--rest)}
.ring.paused{opacity:.45}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mid .big{font-size:clamp(56px,20vw,92px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em}
.mid .lbl{color:var(--mut);font-weight:700;margin-top:2px}
.mid .clk{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px;color:var(--mut)}
.tip{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:14.5px;text-align:left;width:100%;margin-top:6px}
.tip b{font-weight:800}
.linkbtn{color:var(--acc);font-weight:700;min-height:44px;padding:0 12px;text-decoration:underline;text-underline-offset:3px}
:root[data-tema="claro"] .linkbtn{color:var(--tx)}
.tr-actions{padding:10px 16px calc(14px + env(safe-area-inset-bottom));display:grid;gap:10px}
.tr-actions .two{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.safe{padding:16px 20px;flex:1;overflow:auto}
.safe ul{padding-left:22px;margin:10px 0}
.safe li{margin:8px 0;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 6px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mut)}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<noscript>Esta app necesita JavaScript para funcionar.</noscript>
<div id="app">
  <header id="topbar"><h1 id="title">Hoy</h1></header>
  <main id="view"></main>
</div>
<nav id="tabs" aria-label="Secciones"><div>
  <button data-act="tab" data-v="hoy"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Hoy</span></button>
  <button data-act="tab" data-v="rutinas"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>Rutinas</span></button>
  <button data-act="tab" data-v="ejercicios"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6M7 6v12M17 6v12M21 9v6M7 12h10"/></svg><span>Ejercicios</span></button>
  <button data-act="tab" data-v="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2.2" style="fill:var(--s1)"/><circle cx="15" cy="12" r="2.2" style="fill:var(--s1)"/><circle cx="8" cy="18" r="2.2" style="fill:var(--s1)"/></svg><span>Ajustes</span></button>
</div></nav>
<div id="train" hidden></div>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';

/* =====================================================================
   Utilidades
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+pad(s%60);};
const isoDate=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const diaIdx=(d=new Date())=>(d.getDay()+6)%7;   // 0 = lunes

const DIAS=['L','M','X','J','V','S','D'];
const DIAS_L=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];

/* =====================================================================
   Datos: ejercicios (30 de fuerza + 6 de calentamiento / vuelta a la calma)
   Campos: g grupo, sec secundarios, b tipos de banda posibles, anc anclaje,
   ini posición inicial, pasos, resp, err, fac, dif, t 'r' reps | 's' segundos,
   s series por defecto, v reps o segundos por defecto, u unidad, c categoría
   ===================================================================== */
const GRUPOS=['piernas','glúteos','espalda','pecho','hombros','brazos','core','movilidad'];
const TIPOS={mini:'Mini band (loop)',asas:'Banda con asas o tubo',power:'Banda larga (power band)'};
const TIPOS_C={mini:'Mini band',asas:'Asas / tubo',power:'Banda larga'};
const COLORES=[['amarillo','Amarillo','#f2d13e'],['verde','Verde','#4cc38a'],['rojo','Rojo','#ef5350'],['azul','Azul','#4f8ef7'],['negro','Negro','#22282e'],['morado','Morado','#a26bf0'],['naranja','Naranja','#ff9a3d'],['otro','Otro','#9aa0a6']];
const colorHex=id=>(COLORES.find(c=>c[0]===id)||COLORES[7])[2];

const puerta=h=>'Banda anclada '+h+' en una puerta cerrada que se abra hacia el lado contrario al tuyo (así, al tirar, la puerta empuja contra el marco). Usa un anclaje de puerta o un nudo grande y comprueba que no cede antes de empezar.';

const EJ=[
/* ---------- PIERNAS ---------- */
{id:'sentadilla-mini',n:'Sentadilla con mini band',g:'piernas',sec:['glúteos','core'],b:['mini'],
 anc:'Sin anclaje: la mini band va justo encima de las rodillas.',
 ini:'De pie, pies algo más anchos que los hombros, puntas ligeramente hacia fuera. Mini band sobre las rodillas.',
 pasos:['Lleva la cadera hacia atrás y abajo, como si te sentaras.','Empuja las rodillas hacia fuera contra la banda; que no se vayan hacia dentro.','Baja hasta donde mantengas la espalda recta y los talones en el suelo.','Sube empujando el suelo con todo el pie.'],
 resp:'Inhala al bajar, exhala al subir.',
 err:['Las rodillas se van hacia dentro.','Los talones se despegan del suelo.','La espalda se redondea.'],
 fac:'Sentadilla hasta tocar una silla y volver a subir.',dif:'Pausa de 2 segundos abajo o una banda más fuerte.',t:'r',s:3,v:12},
{id:'sentadilla-pisada',n:'Sentadilla con banda pisada',g:'piernas',sec:['glúteos','core'],b:['asas','power'],
 anc:'Pisa la banda con los dos pies; los extremos o asas quedan a la altura de los hombros.',
 ini:'De pie sobre el centro de la banda, pies al ancho de los hombros. Sujeta los extremos junto a los hombros, codos por delante.',
 pasos:['Con las manos fijas en los hombros, lleva la cadera atrás y baja.','Pecho alto, mirada al frente, peso repartido por todo el pie.','Sube estirando cadera y rodillas.'],
 resp:'Inhala al bajar, exhala al subir.',
 err:['Dejar que la banda tire de los hombros hacia delante.','Inclinar demasiado el torso.'],
 fac:'Menos profundidad o una banda más ligera.',dif:'Pausa de 2 segundos abajo o una banda más fuerte (comprueba que no resbala bajo el pie).',t:'r',s:3,v:12},
{id:'zancada-atras',n:'Zancada atrás con banda',g:'piernas',sec:['glúteos','core'],b:['asas','power'],
 anc:'Pisa la banda con el pie que queda delante; los extremos a la altura de los hombros.',
 ini:'De pie con un pie sobre la banda y las manos junto a los hombros. El otro pie, atrás, listo para dar el paso.',
 pasos:['Da un paso largo hacia atrás.','Baja la rodilla de atrás hacia el suelo sin llegar a tocarlo.','Rodilla delantera alineada con el pie, sin pasar hacia dentro.','Empuja con la pierna de delante para volver al inicio.'],
 resp:'Inhala al bajar, exhala al subir.',
 err:['La rodilla delantera cae hacia dentro.','Pasos demasiado cortos que cargan la rodilla.'],
 fac:'Sin banda y con una mano apoyada en una pared o silla.',dif:'Pausa abajo de 2 segundos o una banda más fuerte.',t:'r',s:3,v:10,u:'reps por lado'},
{id:'peso-muerto-rumano',n:'Peso muerto rumano con banda',g:'piernas',sec:['glúteos','espalda'],b:['asas','power'],

const segTrabajo=(e,it)=>e.t==='s'?it.v:Math.max(8,Math.round(it.v*3*(porLado(e)?2:1)));

const NIVEL={principiante:{s:2,d:60,t:'Principiante',x:'2 series y 60 s de descanso'},intermedio:{s:3,d:45,t:'Intermedio',x:'3 series y 45 s de descanso'},avanzado:{s:4,d:40,t:'Avanzado',x:'4 series y 40 s de descanso'}};

function rutinasEjemplo(nivel,dias){
  const n=NIVEL[nivel]||NIVEL.principiante;
  const cal=id=>({ej:id,s:1,v:EJMAP[id].v,d:10});
  const F=(id,v)=>({ej:id,s:n.s,v:v==null?EJMAP[id].v:v,d:n.d});
  const R=[
    {id:uid('r'),nombre:'Full body',desc:'Todo el cuerpo en una sesión: piernas, espalda, pecho, hombros y core.',dias:[],
     items:[cal('cal-marcha'),cal('cal-brazos'),F('sentadilla-pisada'),F('remo-sentado'),F('press-pecho'),F('puente-gluteo-mini'),F('press-hombro'),F('pallof-press'),cal('vu-cuadriceps'),cal('vu-nino')]},
    {id:uid('r'),nombre:'Glúteos y piernas',desc:'Glúteos, cuádriceps e isquios, con trabajo de glúteo medio.',dias:[],
     items:[cal('cal-marcha'),cal('cal-cadera'),F('sentadilla-mini'),F('puente-gluteo-mini'),F('peso-muerto-rumano'),F('zancada-atras'),F('caminata-lateral'),F('almeja'),F('elevacion-talones'),cal('vu-cuadriceps'),cal('vu-nino')]},
    {id:uid('r'),nombre:'Tren superior',desc:'Espalda, pecho, hombros y brazos.',dias:[],
     items:[cal('cal-brazos'),cal('cal-marcha'),F('press-pecho'),F('remo-inclinado'),F('press-hombro'),F('jalon-puerta'),F('curl-biceps'),F('extension-triceps-cabeza'),F('face-pull',15),cal('vu-pecho'),cal('vu-nino')]},
    {id:uid('r'),nombre:'Core',desc:'Estabilidad y fuerza del tronco, sin impacto. Sirve como sesión extra.',dias:[],
     items:[cal('cal-marcha'),cal('cal-cadera'),F('pallof-press'),F('lenador'),F('crunch-rodillas'),F('plancha-abduccion'),F('patada-gluteo'),cal('vu-nino')]}
  ];
  (dias||[]).slice().sort().forEach((d,k)=>{ if(R[k]) R[k].dias=[d]; });
  return R;
}
function defaults(){
  const aj={bandas:[],nivel:'principiante',dias:[0,2,4],duracion:30,sonido:true,vibracion:true,tema:'oscuro',soloMisBandas:true};
  return {v:1,ajustes:aj,rutinas:rutinasEjemplo(aj.nivel,aj.dias),libre:{},sesiones:[]};
}
function migrate(o){
  const d=defaults();
  if(!o||typeof o!=='object') return d;
  const s={v:1};
  s.ajustes=Object.assign({},d.ajustes,o.ajustes||{});
  if(!Array.isArray(s.ajustes.bandas)) s.ajustes.bandas=[];
  if(!Array.isArray(s.ajustes.dias)) s.ajustes.dias=d.ajustes.dias;
  s.rutinas=(Array.isArray(o.rutinas)?o.rutinas:d.rutinas).map(r=>({
    id:r.id||uid('r'),nombre:String(r.nombre||'Rutina'),desc:String(r.desc||''),
    dias:Array.isArray(r.dias)?r.dias.filter(x=>x>=0&&x<=6):[],
    items:(Array.isArray(r.items)?r.items:[]).filter(it=>EJMAP[it.ej]).map(it=>({ej:it.ej,s:clamp(+it.s||1,1,12),v:clamp(+it.v||1,1,600),d:clamp(+it.d||0,0,300)}))
  }));
  s.libre=(o.libre&&typeof o.libre==='object')?o.libre:{};
  s.sesiones=Array.isArray(o.sesiones)?o.sesiones:[];
  return s;
}
const KEY='bandas-en-casa:v1';
let memoria=null;
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw) return migrate(JSON.parse(raw)); }catch(e){ console.warn('No se pudo leer',e); }
  return memoria?migrate(memoria):defaults();
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ memoria=S; }
}
let S=load();

/* ---- Cálculos sobre rutinas ---- */
function estMin(r){
  let t=0;
  r.items.forEach((it,k)=>{
    const e=EJMAP[it.ej]; if(!e) return;
    t+=it.s*segTrabajo(e,it)+(it.s-(k===r.items.length-1?1:0))*it.d+8;
  });
  return Math.max(1,Math.round(t/60));
}
function tiposMios(){ return new Set(S.ajustes.bandas.map(b=>b.tipo)); }
function ejPosible(e){
  if(!S.ajustes.bandas.length||!e.b.length) return true;
  const m=tiposMios(); return e.b.some(b=>m.has(b));
}
function faltan(r){
  if(!S.ajustes.bandas.length) return [];
  const f=new Set();
  r.items.forEach(it=>{const e=EJMAP[it.ej]; if(e&&!ejPosible(e)) f.add(e.b.map(b=>TIPOS_C[b]).join(' o '));});
  return [...f];
}

}

function semanaHTML(){
  const hoy=new Date(), di=diaIdx(hoy);
  const lunes=new Date(hoy); lunes.setDate(hoy.getDate()-di);
  let h='<div class="semana" role="group" aria-label="Semana">';
  for(let i=0;i<7;i++){
    const d=new Date(lunes); d.setDate(lunes.getDate()+i);
    const f=isoDate(d);
    const rs=S.rutinas.filter(r=>r.dias.includes(i));
    const hechas=S.sesiones.filter(s=>s.fecha===f).length;
    let pts='';
    if(hechas) pts+='<i class="pt ok"></i>';
    else if(S.libre[f]) pts+='<i class="pt lib"></i>';
    else if(rs.length) pts+=rs.slice(0,3).map(()=>'<i class="pt"></i>').join('');
    else pts+='<i class="pt off"></i>';
    h+=`<button class="dia${i===di?' hoy':''}" data-act="dia" data-i="${i}" aria-label="${cap(DIAS_L[i])} ${d.getDate()}"><span class="dl">${DIAS[i]}</span><span class="dn">${d.getDate()}</span><span class="pts">${pts}</span></button>`;
  }
  return h+'</div>';
}
function rutinaFila(r,cta){
  const n=r.items.filter(it=>EJMAP[it.ej]&&catE(EJMAP[it.ej])==='f').length;
  return `<div class="card rut"><div class="row sp"><div class="grow"><h3>${esc(r.nombre)}</h3><p class="meta">${n} ejercicios de fuerza, unos ${estMin(r)} min</p></div><button class="btn primary" data-act="empezar" data-id="${r.id}">${cta||'Empezar'}</button></div></div>`;
}
function vistaHoy(){
  const hoy=new Date(), f=isoDate(hoy), di=diaIdx(hoy);
  const asign=S.rutinas.filter(r=>r.dias.includes(di));
  const hechas=S.sesiones.filter(s=>s.fecha===f);
  const libre=S.libre[f];
  let h=`<p class="fecha">${cap(hoy.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}))}</p>`+semanaHTML();

  if(hechas.length){
    h+=`<div class="card"><h3>Sesión hecha hoy</h3>`+hechas.map(s=>`<p class="hint" style="margin:6px 0 0">${esc(s.rutina)}, ${Math.max(1,Math.round(s.seg/60))} min, ${s.series} series</p>`).join('')+`</div>`;
  }
  if(libre){
    h+=`<div class="card"><h3>Hoy: ${esc(libre)}</h3><p class="hint">Día libre anotado. Descansar también forma parte del plan.</p><button class="btn ghost sm" data-act="librex">Quitar y volver a entrenar</button></div>`;
  }else if(asign.length){
    h+=asign.map(r=>{
      const falt=faltan(r);
      return rutinaFila(r,hechas.some(s=>s.rutinaId===r.id)?'Repetir':'Empezar')+(falt.length?`<div class="warn">Te falta banda para esta rutina: ${esc(falt.join('; '))}.</div>`:'');
    }).join('');
    h+=`<div class="card"><h3>¿Hoy no te encaja?</h3><p class="hint">Marca el día como libre y sigue mañana.</p>${libreBotones()}</div>`;
  }else{
    h+=`<div class="card"><h3>Hoy no hay rutina</h3><p class="hint">Descansa, sal a correr o haz algo de movilidad. Anótalo si quieres.</p>${libreBotones()}</div>`;
  }
  h+=`<div class="card"><h3>Entrenar otra rutina</h3><p class="hint">Cualquier rutina se puede hacer en cualquier día.</p>`+
     S.rutinas.map(r=>`<div class="row sp" style="margin:8px 0"><div class="grow"><b>${esc(r.nombre)}</b><br><small>${estMin(r)} min</small></div><button class="btn sm" data-act="empezar" data-id="${r.id}">Empezar</button></div>`).join('')+`</div>`;
  return h;
}

  return '<div class="chips">'+['Descanso','Correr','Yoga','Movilidad','Otra actividad'].map(a=>`<button class="chip" data-act="libre" data-v="${a}">${a}</button>`).join('')+'</div>';
}

function vistaRutinas(){
  let h=`<p class="hint">Plantillas semanales. Toca los días para moverlas.</p><button class="btn primary block" data-act="nueva">Nueva rutina</button>`;
  if(!S.rutinas.length) h+='<p class="empty">Aún no tienes rutinas. Crea una o añade las de ejemplo desde Ajustes.</p>';
  h+=S.rutinas.map(r=>{
    const n=r.items.filter(it=>EJMAP[it.ej]&&catE(EJMAP[it.ej])==='f').length, m=estMin(r), falt=faltan(r);
    return `<article class="card rut">
      <h3>${esc(r.nombre)}</h3>
      ${r.desc?`<p class="desc">${esc(r.desc)}</p>`:''}

      ${m>S.ajustes.duracion+5?`<div class="warn">Dura más de tus ${S.ajustes.duracion} min disponibles. Puedes quitar ejercicios o series al editarla.</div>`:''}

      <div class="dias" role="group" aria-label="Días de la rutina">${DIAS.map((d,i)=>`<button class="chip${r.dias.includes(i)?' on':''}" data-act="rdia" data-id="${r.id}" data-i="${i}" aria-pressed="${r.dias.includes(i)}" aria-label="${cap(DIAS_L[i])}">${d}</button>`).join('')}</div>
      <div class="acciones">
        <button class="btn primary" data-act="empezar" data-id="${r.id}">Empezar</button>
        <button class="btn sm" data-act="editar" data-id="${r.id}">Editar</button>
        <button class="btn sm" data-act="dup" data-id="${r.id}">Duplicar</button>

      </div></article>`;
  }).join('');
  return h;
}

function filtrar(q,g,b,mis){
  return EJ.filter(e=>{
    if(g!=='todos'&&e.g!==g) return false;
    if(b!=='todas'&&!e.b.includes(b)) return false;
    if(mis&&!ejPosible(e)) return false;
    if(q){ const t=norm(e.n+' '+e.g+' '+e.sec.join(' ')); if(!t.includes(norm(q))) return false; }
    return true;
  });
}
function chipsGrupo(sel,act){
  return ['todos',...GRUPOS].map(g=>`<button class="chip${sel===g?' on':''}" data-act="${act}" data-v="${g}">${cap(g)}</button>`).join('');
}
function listaEj(arr,pick){
  if(!arr.length) return '<p class="empty">Ningún ejercicio coincide. Prueba a quitar filtros o el filtro de «solo mis bandas».</p>';
  return arr.map(e=>{
    const tags=e.b.map(b=>`<span class="tag">${TIPOS_C[b]}</span>`).join('');
    const meta=cap(e.g)+(e.sec.length?', también '+e.sec.join(', '):'');
    if(pick) return `<div class="ex pick"><button class="grow" style="text-align:left" data-act="ficha" data-id="${e.id}"><div class="n">${esc(e.n)}</div><div class="m">${esc(meta)}</div><div class="tags">${tags}</div></button><button class="btn sm primary" data-act="pk-add" data-id="${e.id}">Añadir</button></div>`;
    return `<button class="ex" data-act="ficha" data-id="${e.id}"><div class="n">${esc(e.n)}</div><div class="m">${esc(meta)}</div><div class="tags">${tags}</div></button>`;
  }).join('');
}

let ac=null, wl=null;
function unlockAudio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
function beep(freq,dur){
  if(!S.ajustes.sonido) return;
  try{
    unlockAudio(); if(!ac) return;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.value=freq||880; g.gain.value=.22;
    o.connect(g); g.connect(ac.destination);
    const t=ac.currentTime; g.gain.setValueAtTime(.22,t); g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.15));
    o.start(t); o.stop(t+(dur||.15)+.02);
  }catch(e){}
}
function vib(p){ if(S.ajustes.vibracion&&navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } }
async function wake(){ try{ if('wakeLock' in navigator&&!wl){ wl=await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>{wl=null;}); } }catch(e){} }
function unwake(){ try{ if(wl) wl.release(); }catch(e){} wl=null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&T&&T.fase!=='fin') wake(); });

const RING=2*Math.PI*88;
function ringHTML(cls,mid){
  return `<div class="ring ${cls}${T.pausa?' paused':''}" id="ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="88" fill="none" stroke-width="12"/><circle class="prog" id="ringp" cx="100" cy="100" r="88" fill="none" stroke-width="12" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="${RING.toFixed(2)}" stroke-dashoffset="0"/></svg><div class="mid">${mid}</div></div>`;
}
function barHTML(){ return '<div class="tr-bar" aria-hidden="true">'+T.items.map((_,k)=>`<i class="${k<T.i?'done':k===T.i?'cur':''}"></i>`).join('')+'</div>'; }
function topHTML(sub){
  return `<div class="tr-top"><button class="x" data-act="t-salir" aria-label="Salir del entrenamiento">×</button><div class="ttl"><b>${esc(T.r.nombre)}</b><span>${esc(sub)}</span></div>${T.fase==='trabajo'||T.fase==='descanso'?`<button class="btn sm" data-act="t-pausa">${T.pausa?'Seguir':'Pausa'}</button>`:''}</div>`;
}
function trainHTML(){
  const it=T.items[T.i], e=it&&it.ej;
  if(T.fase==='seguridad'){
    return `<div class="tr">${topHTML('Antes de empezar')}<div class="safe">
      <h2>Revisa antes de empezar</h2>
      <p class="hint" style="margin-top:6px">${T.items.length} pasos, unos ${estMin(T.r)} min.</p>
      <ul><li>Comprueba la banda: sin grietas, cortes ni zonas desgastadas.</li><li>Asegura bien los anclajes y tira suave para comprobar que no ceden.</li><li>Deja espacio libre y un suelo que no resbale.</li></ul>
      <div class="note">Si notas dolor (no la molestia muscular normal), para el ejercicio.</div></div>
      <div class="tr-actions"><button class="btn primary big" data-act="t-go">Todo revisado, empezar</button></div></div>`;
  }
  if(T.fase==='fin'){
    const seg=Math.round((T.tFin-T.t0-T.pausadoTotal)/1000);
    return `<div class="tr">${topHTML('Terminada')}<div class="safe">
      <h2>Sesión terminada</h2><p class="hint" style="margin-top:6px">Buen trabajo. Estira lo que lo necesite y bebe agua.</p>
      <div class="stats"><div class="stat"><b>${fmt(seg)}</b><span>tiempo</span></div><div class="stat"><b>${T.seriesHechas}</b><span>series</span></div><div class="stat"><b>${T.ejHechos}</b><span>ejercicios</span></div></div>
      ${T.saltados?`<p class="hint">Saltaste ${T.saltados} ejercicio${T.saltados>1?'s':''}.</p>`:''}</div>
      <div class="tr-actions"><button class="btn primary big" data-act="t-guardar">Guardar y salir</button><button class="btn" data-act="t-descartar">Salir sin guardar</button></div></div>`;
  }
  const n=T.items.length, sub=`${catTxt(e)}, ejercicio ${T.i+1} de ${n}`;
  if(T.fase==='trabajo'){
    const mid=e.t==='s'
      ?`<div class="big" id="clock">${fmt(it.v)}</div><div class="lbl">tiempo</div>`
      :`<div class="big">${it.v}</div><div class="lbl">${esc(uni(e))}</div><div class="clk" id="clock">0:00</div>`;
    return `<div class="tr">${topHTML(sub)}${barHTML()}<div class="tr-main">
      <p class="tr-set">Serie ${T.s} de ${it.s}</p><h2 class="tr-name">${esc(e.n)}</h2>
      ${ringHTML('work',mid)}
      ${e.t==='r'?'<p class="tr-sub">El aro marca un ritmo orientativo de 3 s por repetición.</p>':''}
      <div class="tip"><b>Ancla:</b> ${esc(e.anc)}</div>
      <button class="linkbtn" data-act="t-ficha">Cómo se hace</button></div>
      <div class="tr-actions">${T.pausa?'<button class="btn primary big" data-act="t-pausa">Continuar</button>':'<button class="btn primary big" data-act="t-hecho">Hecho</button>'}<button class="btn" data-act="t-saltar">Saltar ejercicio</button></div></div>`;
  }
  // descanso
  const nueva=T.s===1;
  const val=`${it.v} ${uni(e)}`;
  return `<div class="tr rest">${topHTML(T.rotulo==='Prepárate'?'Prepárate':'Descanso')}${barHTML()}<div class="tr-main">
    <p class="tr-set">${esc(T.rotulo)}</p>
    ${ringHTML('rest',`<div class="big" id="clock">${fmt(T.dur)}</div><div class="lbl">descanso</div>`)}
    <p class="tr-sub" style="margin-top:4px">Siguiente, serie ${T.s} de ${it.s}</p><h2 class="tr-name" style="font-size:clamp(22px,7vw,30px)">${esc(e.n)}</h2><p class="tr-sub">${esc(val)}</p>
    ${nueva?`<div class="tip"><b>Ancla:</b> ${esc(e.anc)}<br><b>Inicio:</b> ${esc(e.ini)}</div>`:''}
    <button class="linkbtn" data-act="t-ficha">Cómo se hace</button></div>
    <div class="tr-actions">${T.pausa?'<button class="btn primary big" data-act="t-pausa">Continuar</button>':'<button class="btn primary big" data-act="t-sig">Siguiente</button>'}<div class="two"><button class="btn" data-act="t-mas">Más 15 s</button><button class="btn" data-act="t-saltar">Saltar ejercicio</button></div></div></div>`;
}
function renderTrain(){
  const box=$('#train');
  if(!T){ box.hidden=true; box.innerHTML=''; document.body.classList.toggle('noscroll',UI.sheets.length>0); return; }
  const keep=box.querySelector('.tr-main'), sc=keep?keep.scrollTop:0;
  box.innerHTML=trainHTML(); box.hidden=false;
  document.body.classList.add('noscroll');
  const nm=box.querySelector('.tr-main'); if(nm) nm.scrollTop=sc;
  tick(true);
}
function setRing(frac){
  const p=$('#ringp'); if(p) p.style.strokeDashoffset=(RING*(1-clamp(frac,0,1))).toFixed(2);
}
function beepCuenta(rem){
  const s=Math.ceil(rem);
  if(s>=1&&s<=3&&T.lastBeep!==s){ T.lastBeep=s; beep(760,.1); }
}
function tick(force){
  if(!T||(T.pausa&&!force)) return;
  const now=Date.now();
  if(T.fase==='trabajo'){
    const it=T.items[T.i], e=it.ej, ck=$('#clock');
    if(e.t==='s'){
      const rem=(T.fin-now)/1000;
      if(ck) ck.textContent=fmt(rem); setRing(rem/T.dur);
      if(T.pausa) return;
      beepCuenta(rem);
      if(rem<=0){ beep(1100,.35); vib([200,80,200]); completarSerie(); }
    }else{
      const el=(now-T.ini)/1000;
      if(ck) ck.textContent=fmt(Math.floor(el)); setRing(el/segTrabajo(e,it));
    }
  }else if(T.fase==='descanso'){
    const rem=(T.fin-now)/1000, ck=$('#clock');
    if(ck) ck.textContent=fmt(rem); setRing(rem/T.dur);
    if(T.pausa) return;
    beepCuenta(rem);
    if(rem<=0){ beep(1100,.35); vib([200,80,200]); empezarTrabajo(); }
  }
}
function empezarTrabajo(){
  const it=T.items[T.i], now=Date.now();
  T.fase='trabajo'; T.ini=now; T.lastBeep=null;
  if(it.ej.t==='s'){ T.dur=it.v; T.fin=now+it.v*1000; } else { T.dur=null; T.fin=null; }
  renderTrain();
}
function iniciarDescanso(sec,rotulo){
  T.fase='descanso'; T.dur=sec; T.fin=Date.now()+sec*1000; T.lastBeep=null; T.rotulo=rotulo||'Descanso';
  vib(60); renderTrain();
}
function avanzarItem(desc){
  T.i++; T.s=1;
  if(T.i>=T.items.length) return terminar();
  if(desc>0) iniciarDescanso(desc); else empezarTrabajo();
}
function completarSerie(){
  const it=T.items[T.i]; T.seriesHechas++;
  if(T.s<it.s){ T.s++; if(it.d>0) iniciarDescanso(it.d); else empezarTrabajo(); }
  else{ T.ejHechos++; avanzarItem(it.d); }
}
function terminar(){
  T.fase='fin'; T.tFin=Date.now(); unwake();
  beep(660,.2); setTimeout(()=>beep(880,.25),220); vib([150,80,150,80,300]);
  renderTrain();
}
function startTraining(id){
  const r=S.rutinas.find(x=>x.id===id); if(!r) return;
  const items=r.items.map(it=>({ej:EJMAP[it.ej],s:it.s,v:it.v,d:it.d})).filter(x=>x.ej);
  if(!items.length){ toast('Esta rutina no tiene ejercicios'); return; }
  unlockAudio();
  T={r,items,i:0,s:1,fase:'seguridad',pausa:false,pausadoTotal:0,seriesHechas:0,ejHechos:0,saltados:0,t0:Date.now(),timer:setInterval(tick,250)};
  wake(); renderTrain();
}
function cerrarTrain(){
  if(T&&T.timer) clearInterval(T.timer);
  T=null; unwake(); renderTrain();
}
function guardarSesion(){
  const seg=Math.round((T.tFin-T.t0-T.pausadoTotal)/1000);
  S.sesiones.push({id:uid('s'),fecha:isoDate(),rutinaId:T.r.id,rutina:T.r.nombre,seg,series:T.seriesHechas,ejercicios:T.ejHechos,saltados:T.saltados});
  save();
}

const A={
  tab(el){ UI.vista=el.dataset.v; render(); window.scrollTo(0,0); },

  cerrar(){ closeSheet(); },

  dia(el){ openSheet({t:'dia',i:+el.dataset.i}); },
  rdia(el){
    const r=S.rutinas.find(x=>x.id===el.dataset.id), i=+el.dataset.i; if(!r) return;
    r.dias=r.dias.includes(i)?r.dias.filter(x=>x!==i):[...r.dias,i].sort();
    save(); render(); if(UI.sheets.length) renderSheet(true);
  },
  empezar(el){ startTraining(el.dataset.id); },
  libre(el){ S.libre[isoDate()]=el.dataset.v; save(); render(); toast('Anotado: '+el.dataset.v); },
  librex(){ delete S.libre[isoDate()]; save(); render(); },

  /* rutinas */
  nueva(){
    UI.draft={nuevo:true,id:uid('r'),nombre:'',desc:'',dias:[],items:[{ej:'cal-marcha',s:1,v:EJMAP['cal-marcha'].v,d:10},{ej:'vu-nino',s:1,v:EJMAP['vu-nino'].v,d:10}]};
    openSheet({t:'editor'});
  },
  editar(el){
    const r=S.rutinas.find(x=>x.id===el.dataset.id); if(!r) return;
    UI.draft=JSON.parse(JSON.stringify(r)); UI.draft.nuevo=false; openSheet({t:'editor'});
  },
  dup(el){
    const r=S.rutinas.find(x=>x.id===el.dataset.id); if(!r) return;
    const c=JSON.parse(JSON.stringify(r)); c.id=uid('r'); c.nombre=r.nombre+' (copia)'; c.dias=[];
    S.rutinas.splice(S.rutinas.indexOf(r)+1,0,c); save(); render(); toast('Rutina duplicada');
  },
  borrar(el){
    const r=S.rutinas.find(x=>x.id===el.dataset.id); if(!r) return;
    confirmar({titulo:'¿Borrar «'+r.nombre+'»?',texto:'La rutina se elimina. Esta acción no se puede deshacer.',botones:[{t:'Cancelar'},{t:'Borrar rutina',cls:'danger',f:()=>{S.rutinas=S.rutinas.filter(x=>x.id!==r.id);save();render();toast('Rutina borrada');}}]});
  },
  'ed-cancel'(){
    UI.draft=null; closeSheet();
  },
  'ed-dia'(el){ const d=UI.draft,i=+el.dataset.i; d.dias=d.dias.includes(i)?d.dias.filter(x=>x!==i):[...d.dias,i].sort(); renderSheet(true); },
  'ed-st'(el){
    const it=UI.draft.items[+el.dataset.i], f=el.dataset.f, e=EJMAP[it.ej];
    const step=f==='v'?(e.t==='s'?5:1):f==='d'?5:1;
    const lim=f==='s'?[1,12]:f==='v'?(e.t==='s'?[5,600]:[1,100]):[0,300];
    it[f]=clamp(it[f]+(+el.dataset.d)*step,lim[0],lim[1]); renderSheet(true);
  },
  'ed-up'(el){ const a=UI.draft.items,i=+el.dataset.i; if(i>0){ [a[i-1],a[i]]=[a[i],a[i-1]]; renderSheet(true);} },
  'ed-down'(el){ const a=UI.draft.items,i=+el.dataset.i; if(i<a.length-1){ [a[i+1],a[i]]=[a[i],a[i+1]]; renderSheet(true);} },
  'ed-del'(el){ UI.draft.items.splice(+el.dataset.i,1); renderSheet(true); },
  'ed-guardar'(){
    const d=UI.draft;
    if(!d.items.length){ toast('Añade al menos un ejercicio'); return; }
    const r={id:d.id,nombre:(d.nombre||'').trim()||'Mi rutina',desc:(d.desc||'').trim(),dias:d.dias,items:d.items};
    const k=S.rutinas.findIndex(x=>x.id===r.id);
    if(k>=0) S.rutinas[k]=r; else S.rutinas.push(r);
    save(); UI.draft=null; UI.sheets=[]; renderSheet(); render(); toast('Rutina guardada');
  },
  'pk-open'(){ UI.pk={q:'',g:'todos',n:0}; openSheet({t:'picker'}); },
  'pk-g'(el){ UI.pk.g=el.dataset.v; renderSheet(true); },
  'pk-add'(el){
    const e=EJMAP[el.dataset.id], n=NIVEL[S.ajustes.nivel]||NIVEL.principiante, a=UI.draft.items;
    const it=catE(e)==='f'?{ej:e.id,s:n.s,v:e.v,d:n.d}:{ej:e.id,s:1,v:e.v,d:10};
    let pos=a.length;
    if(catE(e)==='f'){ const k=a.findIndex(x=>catE(EJMAP[x.ej])==='vuelta'); if(k>=0) pos=k; }
    else if(catE(e)==='cal'){ pos=0; a.forEach((x,i)=>{ if(catE(EJMAP[x.ej])==='cal') pos=i+1; }); }
    a.splice(pos,0,it); UI.pk.n++;
    const b=$('#sheets .sheet-foot .btn'); if(b) b.textContent='Listo ('+UI.pk.n+' añadidos)';
    toast('Añadido: '+e.n);
  },

  /* biblioteca */
  'lib-g'(el){ UI.lib.g=el.dataset.v; render(); },
  'lib-b'(el){ UI.lib.b=el.dataset.v; render(); },

  /* ajustes */
  badd(){ S.ajustes.bandas.push({id:uid('b'),tipo:'mini',color:'verde',nota:''}); save(); render(); },
  bdel(el){ S.ajustes.bandas=S.ajustes.bandas.filter(b=>b.id!==el.dataset.id); save(); render(); },

  adia(el){ const i=+el.dataset.i,a=S.ajustes; a.dias=a.dias.includes(i)?a.dias.filter(x=>x!==i):[...a.dias,i].sort(); save(); render(); },

  exportar(){
    const data=JSON.stringify(Object.assign({app:'bandas-en-casa',exportado:new Date().toISOString()},S),null,2);

  reset(){
    confirmar({titulo:'¿Borrar todos los datos?',texto:'Se eliminan ajustes, rutinas e historial de este dispositivo. Exporta una copia antes si quieres conservarlos.',botones:[{t:'Cancelar'},{t:'Borrar todo',cls:'danger',f:()=>{S=defaults();save();render();toast('Datos borrados');}}]});
  },

  /* entrenamiento */
  'no-op'(){},
  't-go'(){ unlockAudio(); T.t0=Date.now(); T.pausadoTotal=0; T.s=1; T.i=0; iniciarDescanso(8,'Prepárate'); },

  't-mas'(){ if(T.fase==='descanso'){ T.fin+=15000; T.dur+=15; renderTrain(); } },
  't-saltar'(){
    if(T.pausa) return;
    T.saltados++; avanzarItem(8);
  },
  't-pausa'(){
    if(!T) return;
    if(!T.pausa){ T.pausa=true; T.pausaIni=Date.now(); }
    else{ const dt=Date.now()-T.pausaIni; if(T.fin) T.fin+=dt; if(T.ini) T.ini+=dt; T.pausadoTotal+=dt; T.pausa=false; }
    renderTrain();
  },
  't-ficha'(){ openSheet({t:'ficha',id:T.items[T.i].ej.id}); },
  't-salir'(){
    if(T.fase==='seguridad'){ cerrarTrain(); return; }
    if(T.fase==='fin'){ cerrarTrain(); return; }
    const b=[{t:'Seguir entrenando'}];
    if(T.seriesHechas>0) b.push({t:'Terminar y guardar',cls:'primary',f:()=>{ T.tFin=Date.now(); if(T.pausa){T.pausadoTotal+=T.tFin-T.pausaIni;T.pausa=false;} guardarSesion(); cerrarTrain(); toast('Sesión guardada'); render(); }});
    b.push({t:'Salir sin guardar',cls:'danger',f:()=>{ cerrarTrain(); }});
    confirmar({titulo:'¿Salir del entrenamiento?',texto:T.seriesHechas>0?'Puedes guardar lo que has hecho o salir sin guardar.':'Todavía no has completado ninguna serie.',botones:b});
  },
  't-guardar'(){ guardarSesion(); cerrarTrain(); render(); toast('Sesión guardada'); },
  't-descartar'(){ cerrarTrain(); render(); }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const f=A[el.dataset.act]; if(f) f(el,e);
});

/* Campos de formulario */
const B={
  libq(el){ UI.lib.q=el.value; refrescaLib(); },
  libmis(el){ S.ajustes.soloMisBandas=el.checked; save(); refrescaLib(); },
  pkq(el){ UI.pk.q=el.value; const l=$('#pk-list'); if(l) l.innerHTML=listaEj(filtrar(UI.pk.q,UI.pk.g,'todas',misOn()),true); },
  pkmis(el){ S.ajustes.soloMisBandas=el.checked; save(); renderSheet(true); },
  ednombre(el){ UI.draft.nombre=el.value; },
  eddesc(el){ UI.draft.desc=el.value; },
  sonido(el){ S.ajustes.sonido=el.checked; save(); if(el.checked) beep(880,.12); },
  vibracion(el){ S.ajustes.vibracion=el.checked; save(); if(el.checked) vib(80); },
  btipo(el){ const b=S.ajustes.bandas.find(x=>x.id===el.dataset.id); if(b){ b.tipo=el.value; save(); } },
  bcolor(el){ const b=S.ajustes.bandas.find(x=>x.id===el.dataset.id); if(b){ b.color=el.value; save(); const d=el.closest('.banda').querySelector('.dot'); if(d) d.style.background=colorHex(b.color); } },
  bnota(el){ const b=S.ajustes.bandas.find(x=>x.id===el.dataset.id); if(b){ b.nota=el.value; save(); } }
};
function onCampo(e){ const el=e.target, k=el.dataset&&el.dataset.bind; if(k&&B[k]) B[k](el); }
document.addEventListener('input',onCampo);
document.addEventListener('change',e=>{ if(e.target.type==='checkbox'||e.target.tagName==='SELECT') onCampo(e); });

$('#file').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const o=JSON.parse(rd.result);
      if(!o||typeof o!=='object'||!Array.isArray(o.rutinas)||!o.ajustes) throw new Error('formato');
      confirmar({titulo:'¿Importar esta copia?',texto:'Se reemplazan los datos actuales (ajustes, rutinas e historial) por los de la copia.',botones:[{t:'Cancelar'},{t:'Importar',cls:'primary',f:()=>{S=migrate(o);save();render();toast('Copia importada');}}]});
    }catch(err){ toast('El archivo no es una copia válida'); }
  };
  rd.readAsText(f);
});

/* =====================================================================
   Arranque
   ===================================================================== */
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
})();
</script>
