/* ============ Tokens: violetas + contraste ============ */
:root{
  --fd:"Sora",ui-rounded,system-ui,sans-serif;
  --fb:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#0d0817; --s1:#160f26; --s2:#1f1636; --s3:#2b2049; --line:#3a2c5f;
  --tx:#f6f2ff; --mut:#b3a7d1;
  --v:#7c3aed;  --v-i:#ffffff;      /* violeta de marca: chips activos, selección */
  --vh:#c4b5fd;                      /* violeta claro: acentos de texto, pestaña activa */
  --cta:#c9f26b; --cta-i:#150d28;    /* contraste: acción principal (lima) */
  --work:#c9f26b; --rest:#4fe3d0; --run:#ff6fae; --bad:#ff7a90;
}
:root[data-tema="claro"]{
  --bg:#f7f3ff; --s1:#ffffff; --s2:#efe8ff; --s3:#e1d5fb; --line:#d3c4f3;
  --tx:#1a1030; --mut:#5e5085;
  --v:#6d28d9; --v-i:#ffffff; --vh:#5b21b6;
  --cta:#6d28d9; --cta-i:#ffffff;
  --work:#6d28d9; --rest:#0b7f72; --run:#c21d6b; --bad:#c81e46;
}
@media (prefers-color-scheme:light){
  :root[data-tema="auto"]{
    --bg:#f7f3ff; --s1:#ffffff; --s2:#efe8ff; --s3:#e1d5fb; --line:#d3c4f3;
    --tx:#1a1030; --mut:#5e5085;
    --v:#6d28d9; --v-i:#ffffff; --vh:#5b21b6;
    --cta:#6d28d9; --cta-i:#ffffff;
    --work:#6d28d9; --rest:#0b7f72; --run:#c21d6b; --bad:#c81e46;
  }
}

/* ============ Base ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
html[data-tema="claro"]{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--fb);-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:var(--tx);background:var(--s2);border:1.5px solid var(--line);border-radius:14px;min-height:48px;padding:0 12px;width:100%}
input[type=search]{-webkit-appearance:none;appearance:none}
input[type=checkbox]{width:auto;min-height:0;padding:0;border:0;background:none}
:focus-visible{outline:3px solid var(--vh);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--fd)}
h1{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.03em}
h2{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
h3{font-size:17px;line-height:1.3;font-weight:650;letter-spacing:-.01em}
small,.hint{color:var(--mut);font-size:14px}
.hint{margin:4px 0 10px}
a{color:var(--vh)}

#app{max-width:560px;margin:0 auto;min-height:100dvh;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
#topbar{padding:calc(18px + env(safe-area-inset-top)) 0 6px}
.fecha{color:var(--mut);font-size:15px;margin-top:2px}

/* ============ Navegación ============ */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:12px;font-weight:600;color:var(--mut);min-height:64px}
#tabs button svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--vh)}
#tabs button.on span{border-bottom:3px solid var(--vh);padding-bottom:1px}

/* ============ Componentes ============ */
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0}
.card>h3{margin-bottom:2px}
.btn{min-height:52px;padding:0 20px;border-radius:16px;background:var(--s3);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--cta);color:var(--cta-i)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:44px;padding:0 14px;border-radius:12px;font-size:14.5px}
.btn.block{width:100%}
.btn.big{min-height:78px;font-size:24px;border-radius:24px;width:100%;font-family:var(--fd);font-weight:700;letter-spacing:-.01em}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.row>.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:0 14px;min-height:44px;border-radius:999px;background:var(--s2);border:1.5px solid var(--line);font-size:14.5px;font-weight:600}
.chip.on{background:var(--v);border-color:var(--v);color:var(--v-i)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--s3);color:var(--mut);font-size:12.5px;font-weight:600}
.tag.run{color:var(--run)}
.warn{background:rgba(255,122,144,.14);border:1px solid rgba(255,122,144,.45);background:color-mix(in srgb,var(--bad) 14%,transparent);border-color:color-mix(in srgb,var(--bad) 45%,transparent);border-radius:14px;padding:10px 12px;font-size:14px;margin-top:10px}
.note{background:var(--s2);border-radius:14px;padding:10px 12px;font-size:14px;color:var(--mut);margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:28px 8px}
.meter{height:8px;border-radius:4px;background:var(--s3);overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;background:var(--vh);border-radius:4px;transition:width .25s linear}
.meter.tr-m{margin:6px 16px}

/* Semana */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 4px}
.dia{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;border-radius:14px;background:var(--s1);border:1.5px solid var(--line);min-height:72px}
.dia.hoy{border-color:var(--vh);background:var(--s2)}
.dia .dl{font-size:12.5px;color:var(--mut);font-weight:700}
.dia .dn{font-family:var(--fd);font-size:18px;font-weight:700}
.dia .pts{display:flex;gap:3px;height:8px;margin-top:3px;align-items:center}
.pt{width:7px;height:7px;border-radius:50%;background:var(--vh)}
.pt.run{background:var(--run)}
.pt.ok{background:var(--work)}
.pt.lib{background:var(--rest)}
.pt.off{background:var(--s3)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:6px 2px 0}
.leyenda span{display:inline-flex;align-items:center;gap:5px}

/* Rutinas y ejercicios */
.rut h3{font-size:19px}
.rut .desc{color:var(--mut);font-size:15px;margin:2px 0 8px}
.rut .meta{font-size:14px;color:var(--mut)}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.dias .chip{padding:0;justify-content:center}
.acciones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.acciones .primary{grid-column:1/-1}
.filtros{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.ex{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:10px 12px 10px 10px;margin:8px 0}
.ex .th{flex:none;width:76px;height:52px;border-radius:10px;overflow:hidden;background:var(--s2);display:block}
.ex .th img{width:100%;height:100%;object-fit:cover;transform:scale(1.35);transform-origin:50% 34%;display:block}
.ex .th.ph{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px;text-align:center;line-height:1.1}
.ex .tx{flex:1;min-width:0}
.ex .n{font-weight:700;font-size:16px;line-height:1.25}
.ex .m{color:var(--mut);font-size:13.5px;margin-top:1px}
.ex .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* Formularios */
.field{margin:10px 0}
.field>label{display:block;font-weight:700;margin-bottom:6px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banda{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:8px;align-items:center;margin:10px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.banda:last-of-type{border-bottom:0}
.banda input.nota{grid-column:2 / 4}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut)}
.x{width:44px;height:44px;border-radius:12px;font-size:24px;line-height:1;color:var(--mut);display:inline-flex;align-items:center;justify-content:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-weight:600}
.sw input{width:26px;height:26px;accent-color:var(--v)}
.foot{color:var(--mut);font-size:13.5px;text-align:center;margin:18px 8px}
details.reloj{margin-top:12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:0 14px}
details.reloj summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details.reloj[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details.reloj .field{margin:8px 0}

/* Steppers (editor) */
.eit{background:var(--s2);border-radius:18px;padding:12px;margin:10px 0}
.eit-n{font-weight:700}
.eit-c{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:10px}
.stpw small{display:block;font-size:12.5px;margin-bottom:3px}
.stp{display:inline-flex;align-items:center;background:var(--s1);border-radius:12px;border:1px solid var(--line)}
.stp button{width:44px;height:44px;font-size:22px;font-weight:700}
.stp span{min-width:40px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.eit-o{margin-left:auto;display:flex}
.eit-o button{width:44px;height:44px;color:var(--mut);font-size:16px}

/* ============ Imágenes de ejercicios ============ */
.xf{position:relative;width:100%;aspect-ratio:3/2;border-radius:20px;overflow:hidden;background:var(--s2);border:1px solid var(--line);cursor:pointer}
.xf img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .35s ease}
.xf .b{opacity:0}
.xf.b-on .b{opacity:1}
.xf.b-on .a{opacity:0}
.xf .xb{position:absolute;left:10px;top:10px;padding:3px 10px;border-radius:999px;background:rgba(13,8,23,.82);color:#f6f2ff;font-size:12.5px;font-weight:700}
.xf .xs{position:absolute;right:8px;bottom:8px;display:flex;gap:4px;padding:3px;border-radius:999px;background:rgba(13,8,23,.82)}
.xf .xs button{min-height:36px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;color:#f6f2ff}
.xf .xs button.on{background:#7c3aed}
.xf.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;color:var(--mut);padding:16px;cursor:default;aspect-ratio:3/2}
.xf.ph b{color:var(--tx);font-family:var(--fd)}
.pie-img{font-size:13.5px;color:var(--mut);margin:8px 2px 0}
.tr-main .xf{width:min(100%,calc(30dvh*1.5));flex:none;margin:6px 0}

/* ============ Hojas (sheets) ============ */
.backdrop{position:fixed;inset:0;background:rgba(6,3,14,.68);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92dvh;z-index:51;background:var(--s1);border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;border:1px solid var(--line);border-bottom:0}
.sheet.full{top:0;max-height:none;border-radius:0;border:0}
.sheet>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 10px 8px 18px;min-height:64px}
.sheet.full>header{padding-top:calc(10px + env(safe-area-inset-top))}
.sheet-body{overflow:auto;padding:0 18px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-foot .btn{flex:1;padding:0 10px}
.modal{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:420px;margin:0 auto;z-index:51;background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:20px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.ficha h4{margin:18px 0 4px;font-family:var(--fd);font-size:15px;font-weight:700;color:var(--vh)}
.ficha p,.ficha li{font-size:16px}
.ficha ol,.ficha ul{margin:4px 0;padding-left:22px}
.ficha li+li{margin-top:4px}
.ficha .hd{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
.ficha .pain{margin-top:18px}
.sheet-body ul.lista{padding-left:20px}
.sheet-body ul.lista li{margin:8px 0}

/* ============ Entrenamiento y carrera (pantalla completa) ============ */
#train,#run{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
#train[hidden],#run[hidden]{display:none}
.tr{display:flex;flex-direction:column;height:100%;max-width:560px;width:100%;margin:0 auto}
.tr-top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 6px}
.tr-top .ttl{flex:1;min-width:0}
.tr-top .ttl b{display:block;font-family:var(--fd);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-top .ttl span{font-size:13.5px;color:var(--mut)}
.tr-bar{display:flex;gap:4px;padding:6px 16px}
.tr-bar i{flex:1;height:6px;border-radius:3px;background:var(--s3)}
.tr-bar i.done{background:var(--vh)}
.tr-bar i.cur{background:var(--work)}
.tr.rest .tr-bar i.cur{background:var(--rest)}
.tr-main{flex:1;overflow:auto;padding:4px 20px 12px;text-align:center;display:flex;flex-direction:column;align-items:center}
.tr-set{color:var(--mut);font-weight:700;margin-top:6px;min-height:24px}
.tr-name{font-size:clamp(24px,7.4vw,34px);line-height:1.12;margin:2px 0 6px;letter-spacing:-.03em}
.tr-sub{color:var(--mut);font-size:15px}
.ring{position:relative;width:min(70vw,44dvh,300px);aspect-ratio:1;margin:8px auto;flex:none}
.ring.sm{width:min(42vw,21dvh,170px)}
.ring svg{width:100%;height:100%;display:block}
.ring .track{stroke:var(--s3)}
.ring .prog{stroke:var(--work);transition:stroke-dashoffset .25s linear}
.ring.rest .prog{stroke:var(--rest)}
.ring.k-run .prog{stroke:var(--run)}
.ring.k-rest .prog{stroke:var(--rest)}
.ring.k-v .prog{stroke:var(--vh)}
.ring.paused{opacity:.45}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mid .big{font-family:var(--fd);font-size:clamp(56px,20vw,92px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.04em}
.ring.sm .mid .big{font-size:clamp(34px,11vw,52px)}
.mid .lbl{color:var(--mut);font-weight:700;margin-top:2px;font-size:14px}
.mid .clk{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px;color:var(--mut)}
.k-run{color:var(--run)} .k-rest{color:var(--rest)} .k-v{color:var(--vh)}
.tip{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:14.5px;text-align:left;width:100%;margin-top:6px}
.tip b{font-weight:800;color:var(--vh)}
.linkbtn{color:var(--vh);font-weight:700;min-height:44px;padding:0 12px;text-decoration:underline;text-underline-offset:3px}
.tr-actions{padding:10px 16px calc(14px + env(safe-area-inset-bottom));display:grid;gap:10px}
.tr-actions .two{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.tr-actions .two.one{grid-template-columns:1fr}
.safe{padding:16px 20px;flex:1;overflow:auto}
.safe ul{padding-left:22px;margin:10px 0}
.safe li{margin:8px 0;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 6px;text-align:center}
.stat b{display:block;font-family:var(--fd);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mut)}

/* Running */
.plan{display:block;width:100%;text-align:left}
.plan .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sem{margin:10px 0;border:1px solid var(--line);border-radius:16px;background:var(--s1);padding:0 12px}
.sem summary{min-height:48px;display:flex;align-items:center;justify-content:space-between;font-weight:700;cursor:pointer;font-family:var(--fd);font-size:15px}
.sem .s{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.sem .s .ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px}
.sem .s.ok .ck{background:var(--vh);border-color:var(--vh);color:var(--bg)}
.sem .s .tx{flex:1;min-width:0}
.sem .s .tx b{display:block;font-size:15px}
.sem .s .tx small{font-size:13px}
.carr{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.carr:first-of-type{border-top:0}
.carr b{font-family:var(--fd);font-size:16px}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.rstats .stat b{font-size:20px}


/* Pantallas de poca altura: que el reloj y la foto quepan sin desplazarse */
@media (max-height:720px){
  .tr-main .xf{width:min(100%,calc(24dvh*1.5));margin:4px 0}
  .ring.sm{width:min(36vw,19dvh,140px);margin:4px auto}
  .tr-name{font-size:clamp(22px,6.6vw,28px)!important;margin:0 0 4px}
  .tr-set{margin-top:2px;min-height:20px}
  .tr-actions .btn.big{min-height:62px;font-size:21px;border-radius:20px}
  .tr-actions{gap:8px}
  .tr-actions .btn{min-height:46px}
  .ring{width:min(62vw,36dvh,280px)}
}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<noscript>Esta app necesita JavaScript para funcionar.</noscript>
<div id="app">
  <header id="topbar"><h1 id="title">Hoy</h1></header>

<script>
(function(){
'use strict';

/* =====================================================================
   Utilidades
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+pad(s%60);};
const fmtH=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+pad(m):m)+':'+pad(x);};
const isoDate=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const diaIdx=(d=new Date())=>(d.getDay()+6)%7;   // 0 = lunes
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)&&n>0?n:null;};
const fechaCorta=iso=>cap(new Date(iso+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}).replace('.',''));

const DIAS=['L','M','X','J','V','S','D'];
const DIAS_L=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];

/* =====================================================================
   Datos: ejercicios (30 de fuerza + 6 de calentamiento / vuelta a la calma)
   Campos: g grupo, sec secundarios, b tipos de banda posibles, anc anclaje,
   ini posición inicial, pasos, resp, err, fac, dif, t 'r' reps | 's' segundos,
   s series por defecto, v reps o segundos por defecto, u unidad, c categoría
   ===================================================================== */
const GRUPOS=['piernas','glúteos','espalda','pecho','hombros','brazos','core','movilidad','yoga'];
const TIPOS={mini:'Mini band (loop)',asas:'Banda con asas o tubo',power:'Banda larga (power band)'};
const TIPOS_C={mini:'Mini band',asas:'Asas / tubo',power:'Banda larga'};
const COLORES=[['amarillo','Amarillo','#f2d13e'],['verde','Verde','#4cc38a'],['rojo','Rojo','#ef5350'],['azul','Azul','#4f8ef7'],['negro','Negro','#22282e'],['morado','Morado','#a26bf0'],['naranja','Naranja','#ff9a3d'],['otro','Otro','#9aa0a6']];
const colorHex=id=>(COLORES.find(c=>c[0]===id)||COLORES[7])[2];

const puerta=h=>'Banda anclada '+h+' en una puerta cerrada que se abra hacia el lado contrario al tuyo (así, al tirar, la puerta empuja contra el marco). Usa un anclaje de puerta o un nudo grande y comprueba que no cede antes de empezar.';

const EJ=[
/* ---------- PIERNAS ---------- */
{id:'sentadilla-mini',n:'Sentadilla con mini band',g:'piernas',sec:['glúteos','core'],b:['mini'],
 anc:'Sin anclaje: la mini band va justo encima de las rodillas.',
 ini:'De pie, pies algo más anchos que los hombros, puntas ligeramente hacia fuera. Mini band sobre las rodillas.',
 pasos:['Lleva la cadera hacia atrás y abajo, como si te sentaras.','Empuja las rodillas hacia fuera contra la banda; que no se vayan hacia dentro.','Baja hasta donde mantengas la espalda recta y los talones en el suelo.','Sube empujando el suelo con todo el pie.'],

function migrate(o){
  const d=defaults();
  if(!o||typeof o!=='object') return d;
  const s={v:2};
  s.ajustes=Object.assign({},d.ajustes,o.ajustes||{});
  if(!Array.isArray(s.ajustes.bandas)) s.ajustes.bandas=[];
  if(!Array.isArray(s.ajustes.dias)) s.ajustes.dias=d.ajustes.dias;
  s.rutinas=(Array.isArray(o.rutinas)?o.rutinas:d.rutinas).map(r=>({
    id:r.id||uid('r'),nombre:String(r.nombre||'Rutina'),desc:String(r.desc||''),
    dias:Array.isArray(r.dias)?r.dias.filter(x=>x>=0&&x<=6):[],
    items:(Array.isArray(r.items)?r.items:[]).map(it=>Object.assign({},it,{ej:RENOMBRA[it.ej]||it.ej})).filter(it=>EJMAP[it.ej]).map(it=>({ej:it.ej,s:clamp(+it.s||1,1,12),v:clamp(+it.v||1,1,600),d:clamp(+it.d||0,0,300)}))
  }));
  s.yoga=!!o.yoga;
  if(!s.yoga){ s.rutinas=s.rutinas.concat(rutinasYoga()); s.yoga=true; }   // las rutinas de yoga se añaden una sola vez
  s.libre=(o.libre&&typeof o.libre==='object')?o.libre:{};
  s.sesiones=Array.isArray(o.sesiones)?o.sesiones:[];
  const r=Object.assign(defaultsRunning(),o.running||{});
  if(!Array.isArray(r.dias)) r.dias=[1,3,5];
  if(!r.hechas||typeof r.hechas!=='object') r.hechas={};
  if(!Array.isArray(r.carreras)) r.carreras=[];
  if(r.plan&&!planDe(r.plan)) r.plan=null;
  s.running=r;
  return s;
}

/* ---- Cálculos sobre rutinas ---- */
function estMin(r){
  let t=0;
  r.items.forEach((it,k)=>{
    const e=EJMAP[it.ej]; if(!e) return;
    t+=it.s*segTrabajo(e,it)+(it.s-(k===r.items.length-1?1:0))*it.d+8;
  });
  return Math.max(1,Math.round(t/60));
}
function tiposMios(){ return new Set(S.ajustes.bandas.map(b=>b.tipo)); }
function ejPosible(e){
  if(!S.ajustes.bandas.length||!e.b.length) return true;
  const m=tiposMios(); return e.b.some(b=>m.has(b));
}
function faltan(r){
  if(!S.ajustes.bandas.length) return [];
  const f=new Set();
  r.items.forEach(it=>{const e=EJMAP[it.ej]; if(e&&!ejPosible(e)) f.add(e.b.map(b=>TIPOS_C[b]).join(' o '));});
  return [...f];
}

function siguienteSes(p){ return listaSes(p).find(x=>!S.running.hechas[x.key])||null; }
function ritmo(km,s){
  if(!km||km<=0||!s) return '';
  const r=s/km; let m=Math.floor(r/60), x=Math.round(r%60); if(x===60){m++;x=0;}
  return m+':'+pad(x)+' /km';
}
function lunesDe(d){ const l=new Date(d); l.setHours(12,0,0,0); l.setDate(l.getDate()-diaIdx(l)); return l; }
function statsRun(){
  const cs=S.running.carreras, l=isoDate(lunesDe(new Date())), fin=new Date(lunesDe(new Date())); fin.setDate(fin.getDate()+6);
  const semana=cs.filter(c=>c.fecha>=l&&c.fecha<=isoDate(fin));
  const km=a=>Math.round(a.reduce((t,c)=>t+(c.km||0),0)*10)/10;
  return {semKm:km(semana),semN:semana.length,totKm:km(cs),totN:cs.length};
}

/* =====================================================================
   Fotos propias (IndexedDB) e imágenes
   ===================================================================== */
const IMGU={};    // id -> {1:url,2:url}
const FOTOS={};   // 'id|n' -> Blob
let dbp=null;
function idb(){
  if(dbp) return dbp;
  dbp=new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error('sin IndexedDB'));
    const r=indexedDB.open('bandas-en-casa-fotos',1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('fotos'); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return dbp;
}
function idbOp(mode,fn){
  return idb().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('fotos',mode); const rq=fn(tx.objectStore('fotos'));
    tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
  }));
}
function urlDe(id,n,blob){
  const o=IMGU[id]=IMGU[id]||{}; if(o[n]) URL.revokeObjectURL(o[n]);
  o[n]=URL.createObjectURL(blob); FOTOS[id+'|'+n]=blob;
}
async function cargarFotos(){
  try{
    const db=await idb();
    await new Promise((res,rej)=>{
      const rq=db.transaction('fotos','readonly').objectStore('fotos').openCursor();
      rq.onsuccess=()=>{ const c=rq.result; if(c){ const p=String(c.key).split('|'); if(EJMAP[p[0]]) urlDe(p[0],+p[1],c.value); c.continue(); } else res(); };
      rq.onerror=()=>rej(rq.error);
    });
    if(!T&&!R){ render(); renderSheet(true); }
  }catch(e){ console.warn('Fotos propias no disponibles',e); }
}
async function fotoGuardar(id,n,blob){ await idbOp('readwrite',st=>st.put(blob,id+'|'+n)); urlDe(id,n,blob); }
async function fotoQuitar(id){
  for(const n of [1,2]){
    try{ await idbOp('readwrite',st=>st.delete(id+'|'+n)); }catch(e){}
    if(IMGU[id]&&IMGU[id][n]) URL.revokeObjectURL(IMGU[id][n]);
    delete FOTOS[id+'|'+n];
  }
  delete IMGU[id];
}
async function comprimir(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('imagen no válida')); i.src=url; });
    const k=Math.min(1,900/Math.max(img.width,img.height)), c=document.createElement('canvas');
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const gen=(t,q)=>new Promise(r=>c.toBlob(r,t,q));
    let b=await gen('image/webp',.82); if(!b||b.type!=='image/webp') b=await gen('image/jpeg',.8);
    let q=.7; while(b&&b.size>120*1024&&q>.35){ b=await gen(b.type,q); q-=.1; }
    if(!b) throw new Error('no se pudo comprimir');
    return b;
  } finally { URL.revokeObjectURL(url); }
}
const srcImg=p=>(window.IMGDATA&&window.IMGDATA[p])||p;   // en la versión de un solo archivo las fotos van incluidas
function imgInfo(e){
  const u=IMGU[e.id]||{}, p=e.imagenes;
  const a=u[1]||(p&&srcImg(p.ini)), b=u[2]||(p&&srcImg(p.fin));
  if(!a&&!b) return null;
  const propio=!!(u[1]||u[2]);
  return {a:a||b,b:b||a,tipo:propio?'propia':p.tipo,propio,p};
}

function semanaHTML(){
  const hoy=new Date(), di=diaIdx(hoy), lunes=lunesDe(hoy), rn=S.running;
  let h='<div class="semana" role="group" aria-label="Semana">';
  for(let i=0;i<7;i++){
    const d=new Date(lunes); d.setDate(lunes.getDate()+i);
    const f=isoDate(d);
    const rs=S.rutinas.filter(r=>r.dias.includes(i));
    const hechas=S.sesiones.filter(s=>s.fecha===f).length+rn.carreras.filter(c=>c.fecha===f).length;
    let pts='';
    if(hechas) pts+='<i class="pt ok"></i>';
    else if(S.libre[f]) pts+='<i class="pt lib"></i>';
    else{
      pts+=rs.slice(0,3).map(()=>'<i class="pt"></i>').join('');
      if(rn.plan&&rn.dias.includes(i)) pts+='<i class="pt run"></i>';
      if(!pts) pts='<i class="pt off"></i>';
    }
    h+=`<button class="dia${i===di?' hoy':''}" data-act="dia" data-i="${i}" aria-label="${cap(DIAS_L[i])} ${d.getDate()}"><span class="dl">${DIAS[i]}</span><span class="dn">${d.getDate()}</span><span class="pts">${pts}</span></button>`;
  }
  return h+'</div><div class="leyenda"><span><i class="pt"></i>Fuerza</span><span><i class="pt run"></i>Correr</span><span><i class="pt ok"></i>Hecho</span><span><i class="pt lib"></i>Libre</span></div>';
}

function filtrar(q,g,b,mis){
  return EJ.filter(e=>{
    if(g!=='todos'&&e.g!==g) return false;
    if(b!=='todas'&&!e.b.includes(b)) return false;
    if(mis&&!ejPosible(e)) return false;
    if(q){ const t=norm(e.n+' '+e.g+' '+e.sec.join(' ')); if(!t.includes(norm(q))) return false; }
    return true;
  });
}

}

let ac=null, wl=null;
function unlockAudio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
function beep(freq,dur){
  if(!S.ajustes.sonido) return;
  try{
    unlockAudio(); if(!ac) return;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.value=freq||880;
    o.connect(g); g.connect(ac.destination);
    const t=ac.currentTime; g.gain.setValueAtTime(.22,t); g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.15));
    o.start(t); o.stop(t+(dur||.15)+.02);
  }catch(e){}
}
function vib(p){ if(S.ajustes.vibracion&&navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } }
async function wake(){ try{ if('wakeLock' in navigator&&!wl){ wl=await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>{wl=null;}); } }catch(e){} }
function unwake(){ try{ if(wl) wl.release(); }catch(e){} wl=null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&((T&&T.fase!=='fin')||(R&&R.fase!=='fin'))) wake(); });

}
function setRing(frac){ const p=$('#ringp'); if(p) p.style.strokeDashoffset=(RING*(1-clamp(frac,0,1))).toFixed(2); }
function beepCuenta(o,rem){

  return `<div class="tr-top"><button class="x" data-act="t-salir" aria-label="Salir del entrenamiento">×</button><div class="ttl"><b>${esc(T.r.nombre)}</b><span>${esc(sub)}</span></div>${T.fase==='trabajo'||T.fase==='descanso'?`<button class="btn sm" data-act="t-pausa">${T.pausa?'Seguir':'Pausa'}</button>`:''}</div>`;
}
function trainHTML(){
  const it=T.items[T.i], e=it&&it.ej;
  if(T.fase==='seguridad'){
    return `<div class="tr">${topHTML('Antes de empezar')}<div class="safe">
      <h2>Revisa antes de empezar</h2>
      <p class="hint" style="margin-top:6px">${T.items.length} pasos, unos ${estMin(T.r)} min.</p>
      <ul><li>Comprueba la banda: sin grietas, cortes ni zonas desgastadas.</li><li>Asegura bien los anclajes y tira suave para comprobar que no ceden.</li><li>Deja espacio libre y un suelo que no resbale.</li><li>Si usas el reloj, inicia ahora la actividad de fuerza en tu Amazfit.</li></ul>
      <div class="note">Si notas dolor (no la molestia muscular normal), para el ejercicio.</div></div>
      <div class="tr-actions"><button class="btn primary big" data-act="t-go">Todo revisado, empezar</button></div></div>`;
  }
  if(T.fase==='fin'){
    const seg=Math.round((T.tFin-T.t0-T.pausadoTotal)/1000);
    return `<div class="tr">${topHTML('Terminada')}<div class="safe">
      <h2>Sesión terminada</h2><p class="hint" style="margin-top:6px">Buen trabajo. Bebe agua y estira lo que lo necesite.</p>
      <div class="stats"><div class="stat"><b>${fmt(seg)}</b><span>tiempo</span></div><div class="stat"><b>${T.seriesHechas}</b><span>series</span></div><div class="stat"><b>${T.ejHechos}</b><span>ejercicios</span></div></div>
      ${T.saltados?`<p class="hint">Saltaste ${T.saltados} ejercicio${T.saltados>1?'s':''}.</p>`:''}
      ${relojHTML(T,'t')}</div>
      <div class="tr-actions"><button class="btn primary big" data-act="t-guardar">Guardar y salir</button><button class="btn" data-act="t-descartar">Salir sin guardar</button></div></div>`;
  }
  const n=T.items.length, sub=T.yoga?`Postura ${T.i+1} de ${n}`:`${catTxt(e)}, ejercicio ${T.i+1} de ${n}`;
  if(T.fase==='trabajo'){
    const lado=e.t==='s'&&porLado(e)?`<span id="lado">${T.mitad?'Cambia de lado':'Primer lado'}</span>`:'';
    const setTxt=T.yoga?(lado||'Mantén la postura'):'Serie '+T.s+' de '+it.s+(lado?'. '+lado:'');
    const mid=e.t==='s'
      ?`<div class="big" id="clock">${fmt(it.v)}</div><div class="lbl">tiempo</div>`
      :`<div class="big">${it.v}</div><div class="lbl">${esc(uni(e))}</div><div class="clk" id="clock">0:00</div>`;
    return `<div class="tr">${topHTML(sub)}${barHTML()}<div class="tr-main">
      <p class="tr-set">${setTxt}</p><h2 class="tr-name">${esc(e.n)}</h2>
      ${imgFrame(e,{auto:!T.pausa,eager:true})}
      ${ringHTML('work sm',mid,T.pausa)}
      <div class="tip">${T.yoga?'<b>Respiración:</b> '+esc(e.resp):'<b>Ancla:</b> '+esc(e.anc)}</div>
      <button class="linkbtn" data-act="t-ficha">Cómo se hace</button></div>
      <div class="tr-actions">${T.pausa?'<button class="btn primary big" data-act="t-pausa">Continuar</button>':'<button class="btn primary big" data-act="t-hecho">Hecho</button>'}<button class="btn" data-act="t-saltar">Saltar ejercicio</button></div></div>`;
  }
  const nueva=T.s===1, val=`${it.v} ${uni(e)}`;
  return `<div class="tr rest">${topHTML(T.rotulo==='Prepárate'?'Prepárate':'Descanso')}${barHTML()}<div class="tr-main">
    <p class="tr-set">${esc(T.rotulo)}</p>
    ${ringHTML('rest sm',`<div class="big" id="clock">${fmt(T.dur)}</div><div class="lbl">${T.yoga?'transición':'descanso'}</div>`,T.pausa)}
    <p class="tr-sub" style="margin-top:2px">${T.yoga?'Siguiente postura':'Siguiente, serie '+T.s+' de '+it.s}</p><h2 class="tr-name" style="font-size:clamp(22px,6.6vw,30px)">${esc(e.n)}</h2>
    ${imgFrame(e,{auto:!T.pausa,eager:true})}
    <p class="tr-sub">${esc(val)}</p>
    ${nueva?`<div class="tip">${T.yoga?'':'<b>Ancla:</b> '+esc(e.anc)+'<br>'}<b>Inicio:</b> ${esc(e.ini)}</div>`:''}
    <button class="linkbtn" data-act="t-ficha">Cómo se hace</button></div>
    <div class="tr-actions">${T.pausa?'<button class="btn primary big" data-act="t-pausa">Continuar</button>':'<button class="btn primary big" data-act="t-sig">Siguiente</button>'}<div class="two"><button class="btn" data-act="t-mas">Más 15 s</button><button class="btn" data-act="t-saltar">Saltar ejercicio</button></div></div></div>`;
}
function renderTrain(){
  const box=$('#train');
  if(!T){ box.hidden=true; box.innerHTML=''; document.body.classList.toggle('noscroll',UI.sheets.length>0||!!R); return; }
  const keep=box.querySelector('.tr-main'), sc=keep?keep.scrollTop:0;
  box.innerHTML=trainHTML(); box.hidden=false;
  document.body.classList.add('noscroll');
  const nm=box.querySelector('.tr-main'); if(nm) nm.scrollTop=sc;
  tick(true);
}
function tick(force){
  if(!T||(T.pausa&&!force)) return;
  const now=Date.now();
  if(T.fase==='trabajo'){
    const it=T.items[T.i], e=it.ej, ck=$('#clock');
    if(e.t==='s'){
      const rem=(T.fin-now)/1000;
      if(ck) ck.textContent=fmt(rem); setRing(rem/T.dur);
      if(T.pausa) return;
      if(!T.mitad&&porLado(e)&&rem>0&&rem<=T.dur/2){ T.mitad=true; beep(880,.15); setTimeout(()=>beep(1180,.2),200); vib([120,60,120]); const l=$('#lado'); if(l) l.textContent='Cambia de lado'; }
      beepCuenta(T,rem);
      if(rem<=0){ beep(1100,.35); vib([200,80,200]); completarSerie(); }
    }else{
      const el=(now-T.ini)/1000;
      if(ck) ck.textContent=fmt(Math.floor(el)); setRing(el/segTrabajo(e,it));
    }
  }else if(T.fase==='descanso'){
    const rem=(T.fin-now)/1000, ck=$('#clock');
    if(ck) ck.textContent=fmt(rem); setRing(rem/T.dur);
    if(T.pausa) return;
    beepCuenta(T,rem);
    if(rem<=0){ beep(1100,.35); vib([200,80,200]); empezarTrabajo(); }
  }
}
function empezarTrabajo(){
  const it=T.items[T.i], now=Date.now();
  T.fase='trabajo'; T.ini=now; T.lastBeep=null; T.mitad=false;
  if(it.ej.t==='s'){ T.dur=it.v; T.fin=now+it.v*1000; } else { T.dur=null; T.fin=null; }
  renderTrain();
}
function iniciarDescanso(sec,rotulo){
  T.fase='descanso'; T.dur=sec; T.fin=Date.now()+sec*1000; T.lastBeep=null; T.rotulo=rotulo||'Descanso';
  vib(60); renderTrain();
}
function avanzarItem(desc){
  T.i++; T.s=1;
  if(T.i>=T.items.length) return terminar();
  if(desc>0) iniciarDescanso(desc,T.yoga?'Cambia de postura':undefined); else empezarTrabajo();
}
function completarSerie(){
  const it=T.items[T.i]; T.seriesHechas++;
  if(T.s<it.s){ T.s++; if(it.d>0) iniciarDescanso(it.d); else empezarTrabajo(); }
  else{ T.ejHechos++; avanzarItem(it.d); }
}
function terminar(){
  T.fase='fin'; T.tFin=Date.now(); unwake();
  beep(660,.2); setTimeout(()=>beep(880,.25),220); vib([150,80,150,80,300]);
  renderTrain();
}
function startTraining(id){
  const r=S.rutinas.find(x=>x.id===id); if(!r) return;
  const items=r.items.map(it=>({ej:EJMAP[it.ej],s:it.s,v:it.v,d:it.d})).filter(x=>x.ej);
  if(!items.length){ toast('Esta rutina no tiene ejercicios'); return; }
  unlockAudio();
  T={r,items,yoga:esYogaRut(r),mitad:false,i:0,s:1,fase:'seguridad',pausa:false,pausadoTotal:0,seriesHechas:0,ejHechos:0,saltados:0,t0:Date.now(),ex:{fcm:'',fcx:'',kcal:'',min:''},timer:setInterval(tick,250)};
  wake(); renderTrain();
}
function cerrarTrain(){
  if(T&&T.timer) clearInterval(T.timer);
  T=null; unwake(); renderTrain();
}
function guardarSesion(){
  const seg=Math.round((T.tFin-T.t0-T.pausadoTotal)/1000);
  const s={id:uid('s'),fecha:isoDate(),rutinaId:T.r.id,rutina:T.r.nombre,seg,series:T.seriesHechas,ejercicios:T.ejHechos,saltados:T.saltados};
  const rl=relojDe(T.ex); if(rl) s.reloj=rl;
  S.sesiones.push(s); save();
}

}
function runHTML(){
  if(R.fase==='listo'){
    const tot=totalSeg(R.seg);
    return `<div class="tr">${rtop('Antes de empezar')}<div class="safe">
      <h2>${esc(R.titulo)}</h2>

      <ul><li>Empieza suave: si no puedes hablar en frases cortas, baja el ritmo.</li><li>Calzado en buen estado y, si sales de noche, luz o ropa reflectante.</li><li>Si usas el Amazfit, inicia ahora la actividad de correr en el reloj.</li></ul>

      <h2>Carrera terminada</h2><p class="hint" style="margin-top:6px">Bien hecho. Camina un rato para bajar pulsaciones.</p>
      <div class="stats"><div class="stat"><b>${fmtH(seg)}</b><span>tiempo</span></div><div class="stat"><b>${R.libre?'-':R.i}</b><span>${R.libre?'sin tramos':'tramos'}</span></div><div class="stat"><b>${km?ritmo(km,seg).replace(' /km',''):'-'}</b><span>min/km</span></div></div>
      <div class="field"><label for="r-km">Distancia en km (opcional)</label><input id="r-km" inputmode="decimal" placeholder="5,2" data-bind="rex" data-f="km" value="${esc(R.ex.km)}"></div>
      <div class="field"><label>Sensación</label><div class="chips">${['Fácil','Justo','Duro'].map(s=>`<button class="chip${R.ex.sens===s?' on':''}" data-act="r-sens" data-v="${s}">${s}</button>`).join('')}</div></div>
      ${relojHTML(R,'r')}</div>

  const mid=R.libre
    ?`<div class="big" id="rclock">0:00</div><div class="lbl">corriendo</div>`
    :`<div class="big" id="rclock">${fmt(sg.s)}</div><div class="lbl">${sg.rep?'repetición '+sg.rep:'tramo '+(R.i+1)+' de '+R.seg.length}</div>`;
  return `<div class="tr run">${rtop(R.libre?'Carrera libre':'Tramo '+(R.i+1)+' de '+R.seg.length)}
    ${R.libre?'':'<div class="meter tr-m" aria-hidden="true"><i id="rbar" style="width:0"></i></div>'}
    <div class="tr-main">
      <h2 class="tr-name k-${k.c}" style="margin-top:14px;font-size:clamp(34px,11vw,52px)">${esc(sg.n)}</h2>
      ${ringHTML('k-'+k.c,mid,R.pausa)}
      <p class="tr-sub" id="rtot"></p>
      ${R.libre?'':`<div class="tip"><b>Siguiente:</b> ${sig?esc(sig.n)+', '+mm(sig.s):'último tramo, ¡ya casi!'}</div>`}
    </div>
    <div class="tr-actions">${R.pausa?'<button class="btn primary big" data-act="r-pausa">Continuar</button>':'<button class="btn primary big" data-act="r-pausa">Pausa</button>'}
      <div class="two${R.libre?' one':''}">${R.libre?'':'<button class="btn" data-act="r-saltar">Saltar tramo</button>'}<button class="btn" data-act="r-terminar">Terminar carrera</button></div></div></div>`;

function renderRun(){
  const box=$('#run');
  if(!R){ box.hidden=true; box.innerHTML=''; document.body.classList.toggle('noscroll',UI.sheets.length>0||!!T); return; }
  const keep=box.querySelector('.safe'), sc=keep?keep.scrollTop:0;
  box.innerHTML=runHTML(); box.hidden=false;
  document.body.classList.add('noscroll');
  const nm=box.querySelector('.safe'); if(nm) nm.scrollTop=sc;
  rtick(true);
}
function rActivo(now){ return (now-R.t0-R.pausadoTotal-(R.pausa?(now-R.pausaIni):0))/1000; }
function rtick(force){
  if(!R||R.fase!=='correr'||(R.pausa&&!force)) return;
  const now=Date.now(), sg=R.seg[R.i], tot=totalSeg(R.seg), act=rActivo(now);
  const ck=$('#rclock'), tt=$('#rtot'), bar=$('#rbar');
  if(R.libre){
    if(ck) ck.textContent=fmtH(act); setRing((act%60)/60);
    if(tt) tt.textContent='Tiempo total '+fmtH(act);
    return;
  }
  const rem=(R.fin-now)/1000;
  if(ck) ck.textContent=fmt(rem); setRing(sg.s?rem/sg.s:0);
  if(tt) tt.textContent='Transcurrido '+fmtH(act)+'. Faltan '+fmtH(Math.max(0,tot-act))+'.';
  if(bar) bar.style.width=Math.min(100,act/tot*100)+'%';
  if(R.pausa) return;
  beepCuenta(R,rem);
  if(rem<=0) siguienteTramo(true);
}
function marcaTramo(){
  const sg=R.seg[R.i], k=KINDS[sg.k];
  if(k.c==='run'){ beep(920,.16); setTimeout(()=>beep(1180,.2),190); vib([300]); }
  else{ beep(520,.28); vib([120,80,120]); }
}
function iniciaTramo(){
  const now=Date.now(); R.ini=now; R.fin=now+R.seg[R.i].s*1000; R.lastBeep=null;
}
function siguienteTramo(){
  R.i++;
  if(R.i>=R.seg.length){ R.i=R.seg.length; return finRun(); }
  iniciaTramo(); marcaTramo(); renderRun();
}
function startRun(o){
  unlockAudio();
  R={titulo:o.titulo,sub:o.sub||'',seg:o.seg,key:o.key||null,plan:o.plan||null,libre:!!o.libre,i:0,fase:'listo',pausa:false,pausadoTotal:0,t0:Date.now(),lastBeep:null,ex:{km:'',sens:'',fcm:'',fcx:'',kcal:''},timer:null};
  R.timer=setInterval(rtick,250);
  wake(); renderRun();
}
function finRun(){
  R.fase='fin'; R.tFin=Date.now(); unwake();
  beep(660,.2); setTimeout(()=>beep(880,.25),220); vib([150,80,150,80,300]);
  renderRun();
}
function cerrarRun(){
  if(R&&R.timer) clearInterval(R.timer);
  R=null; unwake(); renderRun();
}
function guardarRun(){
  const seg=Math.round((R.tFin-R.t0-R.pausadoTotal)/1000);
  const rec={id:uid('c'),fecha:isoDate(),seg,km:num(R.ex.km)?Math.round(num(R.ex.km)*100)/100:null,sens:R.ex.sens||'',tipo:R.titulo,plan:R.plan,key:R.key};
  const rl=relojDe(R.ex); if(rl) rec.reloj=rl;
  S.running.carreras.unshift(rec);
  if(R.key) S.running.hechas[R.key]=rec.fecha;
  save();
}
function iniciarSesPlan(key){
  const p=planActual(); const x=p&&listaSes(p).find(y=>y.key===key); if(!x) return;
  startRun({titulo:x.ses.t,sub:'Semana '+(x.w+1)+', sesión '+(x.s+1)+'. '+x.ses.d,seg:x.ses.seg,key:x.key,plan:p.id});
}

/* =====================================================================
   Acciones (delegación de eventos)
   ===================================================================== */
const A={
  tab(el){ UI.vista=el.dataset.v; render(); window.scrollTo(0,0); },
  ficha(el){ openSheet({t:'ficha',id:el.dataset.id}); },
  cerrar(){ closeSheet(); },
  cf(el){ const c=UI.cf; const b=c&&c.botones[+el.dataset.i]; closeSheet(); if(b&&b.f) b.f(); },
  dia(el){ openSheet({t:'dia',i:+el.dataset.i}); },
  rdia(el){
    const r=S.rutinas.find(x=>x.id===el.dataset.id), i=+el.dataset.i; if(!r) return;
    r.dias=r.dias.includes(i)?r.dias.filter(x=>x!==i):[...r.dias,i].sort();
    save(); render(); if(UI.sheets.length) renderSheet(true);
  },
  empezar(el){ startTraining(el.dataset.id); },
  libre(el){ S.libre[isoDate()]=el.dataset.v; save(); render(); toast('Anotado: '+el.dataset.v); },
  librex(){ delete S.libre[isoDate()]; save(); render(); },

  /* imágenes */
  'img-t'(el){
    const f=el.closest('.xf'); if(!f||f.classList.contains('ph')) return;
    if(el.dataset.v!=null) f.classList.toggle('b-on',el.dataset.v==='1'); else f.classList.toggle('b-on');
    syncPills(f);
  },
  'foto-sel'(el){ UI.fotoT={id:el.dataset.id,n:+el.dataset.n}; const i=$('#foto'); i.value=''; i.click(); },
  async 'foto-quitar'(el){ await fotoQuitar(el.dataset.id); renderSheet(true); render(); toast('Fotos propias quitadas'); },

  /* rutinas */
  nueva(){
    UI.draft={nuevo:true,id:uid('r'),nombre:'',desc:'',dias:[],items:[{ej:'cal-gato',s:1,v:EJMAP['cal-gato'].v,d:10},{ej:'vu-nino',s:1,v:EJMAP['vu-nino'].v,d:10}]};
    openSheet({t:'editor'});
  },
  editar(el){
    const r=S.rutinas.find(x=>x.id===el.dataset.id); if(!r) return;
    UI.draft=JSON.parse(JSON.stringify(r)); UI.draft.nuevo=false; openSheet({t:'editor'});
  },
  dup(el){
    const r=S.rutinas.find(x=>x.id===el.dataset.id); if(!r) return;
    const c=JSON.parse(JSON.stringify(r)); c.id=uid('r'); c.nombre=r.nombre+' (copia)'; c.dias=[];
    S.rutinas.splice(S.rutinas.indexOf(r)+1,0,c); save(); render(); toast('Rutina duplicada');
  },
  borrar(el){
    const r=S.rutinas.find(x=>x.id===el.dataset.id); if(!r) return;
    confirmar({titulo:'¿Borrar «'+r.nombre+'»?',texto:'La rutina se elimina. Esta acción no se puede deshacer.',botones:[{t:'Cancelar'},{t:'Borrar rutina',cls:'danger',f:()=>{S.rutinas=S.rutinas.filter(x=>x.id!==r.id);save();render();toast('Rutina borrada');}}]});
  },
  'ed-cancel'(){ UI.draft=null; closeSheet(); },
  'ed-dia'(el){ const d=UI.draft,i=+el.dataset.i; d.dias=d.dias.includes(i)?d.dias.filter(x=>x!==i):[...d.dias,i].sort(); renderSheet(true); },
  'ed-st'(el){
    const it=UI.draft.items[+el.dataset.i], f=el.dataset.f, e=EJMAP[it.ej];
    const step=f==='v'?(e.t==='s'?5:1):f==='d'?5:1;
    const lim=f==='s'?[1,12]:f==='v'?(e.t==='s'?[5,600]:[1,100]):[0,300];
    it[f]=clamp(it[f]+(+el.dataset.d)*step,lim[0],lim[1]); renderSheet(true);
  },
  'ed-up'(el){ const a=UI.draft.items,i=+el.dataset.i; if(i>0){ [a[i-1],a[i]]=[a[i],a[i-1]]; renderSheet(true);} },
  'ed-down'(el){ const a=UI.draft.items,i=+el.dataset.i; if(i<a.length-1){ [a[i+1],a[i]]=[a[i],a[i+1]]; renderSheet(true);} },
  'ed-del'(el){ UI.draft.items.splice(+el.dataset.i,1); renderSheet(true); },
  'ed-guardar'(){
    const d=UI.draft;
    if(!d.items.length){ toast('Añade al menos un ejercicio'); return; }
    const r={id:d.id,nombre:(d.nombre||'').trim()||'Mi rutina',desc:(d.desc||'').trim(),dias:d.dias,items:d.items};
    const k=S.rutinas.findIndex(x=>x.id===r.id);
    if(k>=0) S.rutinas[k]=r; else S.rutinas.push(r);
    save(); UI.draft=null; UI.sheets=[]; renderSheet(); render(); toast('Rutina guardada');
  },
  'pk-open'(){ UI.pk={q:'',g:'todos',n:0}; openSheet({t:'picker'}); },
  'pk-g'(el){ UI.pk.g=el.dataset.v; renderSheet(true); },
  'pk-add'(el){
    const e=EJMAP[el.dataset.id], n=NIVEL[S.ajustes.nivel]||NIVEL.principiante, a=UI.draft.items;
    const it=catE(e)==='f'?{ej:e.id,s:n.s,v:e.v,d:n.d}:{ej:e.id,s:1,v:e.v,d:catE(e)==='yoga'?5:10};
    let pos=a.length;
    if(esMain(e)){ const k=a.findIndex(x=>catE(EJMAP[x.ej])==='vuelta'); if(k>=0) pos=k; }
    else if(catE(e)==='cal'){ pos=0; a.forEach((x,i)=>{ if(catE(EJMAP[x.ej])==='cal') pos=i+1; }); }
    a.splice(pos,0,it); UI.pk.n++;
    const b=$('#sheets .sheet-foot .btn'); if(b) b.textContent='Listo ('+UI.pk.n+' añadidos)';
    toast('Añadido: '+e.n);
  },

  /* biblioteca */
  'lib-g'(el){ UI.lib.g=el.dataset.v; render(); },
  'lib-b'(el){ UI.lib.b=el.dataset.v; render(); },

  /* running */
  'plan-elegir'(el){
    const rn=S.running; rn.plan=el.dataset.id; rn.inicio=isoDate(); rn.hechas={}; save(); render(); toast('Plan elegido');
  },
  'plan-cambiar'(){
    confirmar({titulo:'¿Cambiar de plan?',texto:'El progreso del plan actual se reinicia. Tu historial de carreras se conserva.',botones:[{t:'Seguir con este plan'},{t:'Cambiar de plan',cls:'primary',f:()=>{ S.running.plan=null; S.running.hechas={}; save(); render(); }}]});
  },
  rundia(el){
    const i=+el.dataset.i, r=S.running; r.dias=r.dias.includes(i)?r.dias.filter(x=>x!==i):[...r.dias,i].sort();
    save(); render(); if(UI.sheets.length) renderSheet(true);
  },
  'run-plan'(el){ UI.sheets=[]; renderSheet(); iniciarSesPlan(el.dataset.key); },
  'run-libre'(){ startRun({titulo:'Carrera libre',seg:[{k:'lib',s:0,n:'Carrera libre'}],libre:true}); },
  'ses-ver'(el){ openSheet({t:'sesver',key:el.dataset.key}); },
  'ses-hecha'(el){
    const k=el.dataset.key, h=S.running.hechas;
    if(h[k]) delete h[k]; else h[k]=isoDate();
    save(); closeSheet(); render(); toast(h[k]?'Sesión marcada como hecha':'Marca quitada');
  },
  'carrera-nueva'(){ openSheet({t:'carrera'}); },
  'carrera-guardar'(){
    const min=num($('#c-min').value), km=num($('#c-km').value), f=$('#c-fecha').value||isoDate();
    if(!min){ toast('Indica el tiempo en minutos'); return; }
    S.running.carreras.unshift({id:uid('c'),fecha:f,seg:Math.round(min*60),km:km?Math.round(km*100)/100:null,sens:$('#c-sens').value,tipo:'Carrera anotada',plan:null,key:null});
    S.running.carreras.sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0);
    save(); closeSheet(); render(); toast('Carrera guardada');
  },
  cdel(el){
    confirmar({titulo:'¿Borrar esta carrera?',texto:'Se elimina del historial. Esta acción no se puede deshacer.',botones:[{t:'Cancelar'},{t:'Borrar carrera',cls:'danger',f:()=>{ S.running.carreras=S.running.carreras.filter(c=>c.id!==el.dataset.id); save(); render(); }}]});
  },
  'r-go'(){ unlockAudio(); R.fase='correr'; R.t0=Date.now(); R.pausadoTotal=0; R.i=0; iniciaTramo(); marcaTramo(); renderRun(); },
  'r-pausa'(){
    if(!R||R.fase!=='correr') return;
    if(!R.pausa){ R.pausa=true; R.pausaIni=Date.now(); }
    else{ const dt=Date.now()-R.pausaIni; R.fin+=dt; R.pausadoTotal+=dt; R.pausa=false; }
    renderRun();
  },
  'r-saltar'(){ if(R.pausa) return; siguienteTramo(); },
  'r-terminar'(){
    confirmar({titulo:'¿Terminar la carrera?',texto:'Pasarás a guardar el resultado.',botones:[{t:'Seguir corriendo'},{t:'Terminar',cls:'primary',f:()=>{ if(R.pausa){ R.pausadoTotal+=Date.now()-R.pausaIni; R.pausa=false; } finRun(); }}]});
  },
  'r-salir'(){
    if(R.fase==='listo'||R.fase==='fin'){ cerrarRun(); return; }
    confirmar({titulo:'¿Salir de la carrera?',texto:'Puedes terminar y guardar lo que llevas, o salir sin guardar.',botones:[{t:'Seguir corriendo'},{t:'Terminar y guardar',cls:'primary',f:()=>{ if(R.pausa){ R.pausadoTotal+=Date.now()-R.pausaIni; R.pausa=false; } finRun(); }},{t:'Salir sin guardar',cls:'danger',f:()=>{ cerrarRun(); }}]});
  },
  'r-sens'(el){ R.ex.sens=R.ex.sens===el.dataset.v?'':el.dataset.v; renderRun(); },
  'r-guardar'(){ guardarRun(); cerrarRun(); render(); toast('Carrera guardada'); },
  'r-descartar'(){ cerrarRun(); render(); },

  /* ajustes */
  badd(){ S.ajustes.bandas.push({id:uid('b'),tipo:'mini',color:'verde',nota:''}); save(); render(); },
  bdel(el){ S.ajustes.bandas=S.ajustes.bandas.filter(b=>b.id!==el.dataset.id); save(); render(); },
  nivel(el){ S.ajustes.nivel=el.dataset.v; save(); render(); },
  adia(el){ const i=+el.dataset.i,a=S.ajustes; a.dias=a.dias.includes(i)?a.dias.filter(x=>x!==i):[...a.dias,i].sort(); save(); render(); },
  dur(el){ S.ajustes.duracion=+el.dataset.v; save(); render(); },
  tema(el){ S.ajustes.tema=el.dataset.v; save(); render(); },
  creditos(){ openSheet({t:'creditos'}); },
  async exportar(){
    const fotos={};
    for(const k of Object.keys(FOTOS)){
      fotos[k]=await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(null); r.readAsDataURL(FOTOS[k]); });
    }
    const obj=Object.assign({app:'bandas-en-casa',exportado:new Date().toISOString()},S);
    if(Object.keys(fotos).length) obj.fotos=fotos;
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));
    a.download='bandas-en-casa-'+isoDate()+'.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('Copia exportada');
  },
  importar(){ $('#file').value=''; $('#file').click(); },
  async 'fotos-check'(){
    const rutas=[]; EJ.forEach(e=>{ if(e.imagenes){ rutas.push(e.imagenes.ini,e.imagenes.fin); } });
    toast('Comprobando fotos…');
    const falla=[];
    await Promise.all(rutas.map(r=>new Promise(res=>{ const i=new Image(); const t=setTimeout(()=>{falla.push(r);res();},8000); i.onload=()=>{clearTimeout(t);res();}; i.onerror=()=>{clearTimeout(t);falla.push(r);res();}; i.src=srcImg(r); })));
    const ok=rutas.length-falla.length;
    confirmar({titulo:falla.length?'Faltan '+falla.length+' fotos':'Todas las fotos están',texto:falla.length?ok+' de '+rutas.length+' fotos se ven bien. Faltan, por ejemplo: '+falla.slice(0,3).map(f=>f.split('/').pop()).join(', ')+'. Vuelve a subir la carpeta img/ejercicios completa (en dos tandas si usas el navegador de GitHub) o abre la app desde la carpeta extraída del ZIP.':ok+' de '+rutas.length+' fotos se ven bien.',botones:[{t:'Vale'}]});
  },
  'yoga-add'(){ rutinasYoga().forEach(r=>S.rutinas.push(r)); save(); render(); toast('Rutinas de yoga añadidas'); },
  ejemplos(){
    rutinasEjemplo(S.ajustes.nivel,[]).forEach(r=>S.rutinas.push(r)); save(); render(); toast('Rutinas de ejemplo añadidas');
  },
  reset(){
    confirmar({titulo:'¿Borrar todos los datos?',texto:'Se eliminan ajustes, rutinas, historial, carreras y tus fotos de este dispositivo. Exporta una copia antes si quieres conservarlos.',botones:[{t:'Cancelar'},{t:'Borrar todo',cls:'danger',f:async()=>{ for(const id of Object.keys(IMGU)) await fotoQuitar(id); S=defaults(); save(); render(); toast('Datos borrados'); }}]});
  },

  /* entrenamiento de fuerza */
  't-go'(){ unlockAudio(); T.t0=Date.now(); T.pausadoTotal=0; T.s=1; T.i=0; iniciarDescanso(8,'Prepárate'); },
  't-hecho'(){ if(T.pausa) return; beep(700,.08); vib(40); completarSerie(); },
  't-sig'(){ if(T.pausa) return; empezarTrabajo(); },
  't-mas'(){ if(T.fase==='descanso'){ T.fin+=15000; T.dur+=15; renderTrain(); } },
  't-saltar'(){ if(T.pausa) return; T.saltados++; avanzarItem(8); },
  't-pausa'(){
    if(!T) return;
    if(!T.pausa){ T.pausa=true; T.pausaIni=Date.now(); }
    else{ const dt=Date.now()-T.pausaIni; if(T.fin) T.fin+=dt; if(T.ini) T.ini+=dt; T.pausadoTotal+=dt; T.pausa=false; }
    renderTrain();
  },
  't-ficha'(){ openSheet({t:'ficha',id:T.items[T.i].ej.id}); },
  't-salir'(){
    if(T.fase==='seguridad'||T.fase==='fin'){ cerrarTrain(); return; }
    const b=[{t:'Seguir entrenando'}];
    if(T.seriesHechas>0) b.push({t:'Terminar y guardar',cls:'primary',f:()=>{ T.tFin=Date.now(); if(T.pausa){T.pausadoTotal+=T.tFin-T.pausaIni;T.pausa=false;} guardarSesion(); cerrarTrain(); toast('Sesión guardada'); render(); }});
    b.push({t:'Salir sin guardar',cls:'danger',f:()=>{ cerrarTrain(); }});
    confirmar({titulo:'¿Salir del entrenamiento?',texto:T.seriesHechas>0?'Puedes guardar lo que has hecho o salir sin guardar.':'Todavía no has completado ninguna serie.',botones:b});
  },
  't-guardar'(){ guardarSesion(); cerrarTrain(); render(); toast('Sesión guardada'); },
  't-descartar'(){ cerrarTrain(); render(); }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const f=A[el.dataset.act]; if(f) f(el,e);
});

/* Campos de formulario */
const B={
  libq(el){ UI.lib.q=el.value; refrescaLib(); },
  libmis(el){ S.ajustes.soloMisBandas=el.checked; save(); refrescaLib(); },
  pkq(el){ UI.pk.q=el.value; const l=$('#pk-list'); if(l) l.innerHTML=listaEj(filtrar(UI.pk.q,UI.pk.g,'todas',misOn()),true); },
  pkmis(el){ S.ajustes.soloMisBandas=el.checked; save(); renderSheet(true); },
  ednombre(el){ UI.draft.nombre=el.value; },
  eddesc(el){ UI.draft.desc=el.value; },
  sonido(el){ S.ajustes.sonido=el.checked; save(); if(el.checked) beep(880,.12); },
  vibracion(el){ S.ajustes.vibracion=el.checked; save(); if(el.checked) vib(80); },
  btipo(el){ const b=S.ajustes.bandas.find(x=>x.id===el.dataset.id); if(b){ b.tipo=el.value; save(); } },
  bcolor(el){ const b=S.ajustes.bandas.find(x=>x.id===el.dataset.id); if(b){ b.color=el.value; save(); const d=el.closest('.banda').querySelector('.dot'); if(d) d.style.background=colorHex(b.color); } },
  bnota(el){ const b=S.ajustes.bandas.find(x=>x.id===el.dataset.id); if(b){ b.nota=el.value; save(); } },
  tex(el){ if(T) T.ex[el.dataset.f]=el.value; },
  rex(el){ if(R){ R.ex[el.dataset.f]=el.value; if(el.dataset.f==='km'){ const s=$('#run .stat:nth-child(3) b'); if(s&&R.tFin){ const k=num(el.value); s.textContent=k?ritmo(k,Math.round((R.tFin-R.t0-R.pausadoTotal)/1000)).replace(' /km',''):'-'; } } } }
};
function onCampo(e){ const el=e.target, k=el.dataset&&el.dataset.bind; if(k&&B[k]) B[k](el); }
document.addEventListener('input',onCampo);
document.addEventListener('change',e=>{ if(e.target.type==='checkbox'||e.target.tagName==='SELECT') onCampo(e); });

$('#foto').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0], t=UI.fotoT; if(!f||!t) return;
  try{
    const blob=await comprimir(f);
    await fotoGuardar(t.id,t.n,blob);
    toast('Foto guardada'); renderSheet(true); render();
  }catch(err){ toast('No se pudo guardar la foto'); }
});
$('#file').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const o=JSON.parse(rd.result);
      if(!o||typeof o!=='object'||!Array.isArray(o.rutinas)||!o.ajustes) throw new Error('formato');
      confirmar({titulo:'¿Importar esta copia?',texto:'Se reemplazan los datos actuales (ajustes, rutinas, historial, carreras y fotos) por los de la copia.',botones:[{t:'Cancelar'},{t:'Importar',cls:'primary',f:async()=>{
        S=migrate(o); save();
        try{
          for(const id of Object.keys(IMGU)) await fotoQuitar(id);
          for(const k of Object.keys(o.fotos||{})){
            const p=k.split('|'); if(!EJMAP[p[0]]||typeof o.fotos[k]!=='string') continue;
            const blob=await (await fetch(o.fotos[k])).blob(); await fotoGuardar(p[0],+p[1],blob);
          }
        }catch(err){ console.warn('Fotos no restauradas',err); }
        render(); toast('Copia importada');
      }}]});
    }catch(err){ toast('El archivo no es una copia válida'); }
  };
  rd.readAsText(f);
});

/* =====================================================================
   Arranque
   ===================================================================== */
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
render();
cargarFotos();
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
window.__app={get S(){return S;},get T(){return T;},get R(){return R;},EJ,PLANES};
})();
</script>
